<svg xmlns="http://www.w3.org/2000/svg" width="880" height="375" viewBox="0 0 880 375" role="img" aria-labelledby="title desc"><title id="title">冰面取鱼：左路一步得一条，右路两步得四条</title><desc id="desc">企鹅在同一起点选路，左路一步结束，右路第一步经过空冰面，第二步才收到四条鱼。</desc><defs>
