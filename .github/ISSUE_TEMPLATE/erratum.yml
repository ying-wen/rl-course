name: 勘误
description: 错字、公式、记号、数字或链接的错误
title: "[勘误] 第 N 章 N.K："
labels: ["勘误"]
body:
  - type: input
    id: where
    attributes:
      label: 位置
      description: 网址（带 # 锚点最好），或“第几章、哪一节、哪一段”；课件请写页码或页面网址
      placeholder: https://yingwen.io/rl-course/reading/chapter-06.html#…
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: 出现在
      options: [阅读稿（网页）, 阅读稿 PDF, 逐页课件, 课件 PDF, 代码, 其他]
    validations:
      required: true
  - type: textarea
    id: original
    attributes:
      label: 原文
      description: 把有误的句子或公式贴过来
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: 应改为
      description: 你认为正确的写法，以及依据（推导、文献页码、代码输出）
    validations:
      required: true
