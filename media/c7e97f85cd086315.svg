<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="t d"><title id="t">同一场天气，两条自己的航迹</title><desc id="d">评测者配对起点与外生天气。学习器各自飞行，所以只有到达的位置获得测量。分叉后沿各自的航迹计入探测、返站、恢复与失效。诊断副本不反馈给智能体。</desc>
<defs><pattern id="band" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#fffaf1"/><path d="M0 0v8" stroke="#ead5a4" stroke-width="2"/></pattern></defs>
<rect x="1" y="1" width="998" height="438" rx="12" fill="#fbfcf9" stroke="#b8cbc7"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#193a44"><text x="32" y="45" font-size="27" font-weight="bold">同一场天气，两条自己的航迹</text><text x="32" y="78" font-size="19">固定两组的初始风估计器、安全约束和计算预算。飞行后，测量由各自的位置决定。</text>
<rect x="230" y="110" width="716" height="93" fill="#e8f4ed"/><rect x="230" y="206" width="716" height="96" fill="url(#band)"/><g font-size="17"><text x="36" y="150">仍可提供服务</text><text x="36" y="237">暂时不能服务</text><text x="36" y="272">探测时间也计入航期</text></g>
<g fill="none" stroke-width="5"><path d="M230 170C325 145 362 140 400 168S470 269 530 259S614 164 680 153S830 160 946 162" stroke="#087768"/><path d="M230 170C330 146 365 143 400 168S504 177 562 188S642 250 715 248S844 186 946 179" stroke="#a86427" stroke-dasharray="11 6"/></g><g fill="#087768"><circle cx="230" cy="170" r="7"/><circle cx="530" cy="259" r="7"/><circle cx="680" cy="153" r="7"/></g>
<text x="480" y="291" font-size="16">换层测风</text><text x="680" y="141" font-size="16">沿返向风回站</text><path d="M38 342h42" stroke="#087768" stroke-width="5"/><text x="90" y="348" font-size="18">允许新预测影响规划</text><path d="M375 342h42" stroke="#a86427" stroke-width="5" stroke-dasharray="9 5"/><text x="427" y="348" font-size="18">已有控制器与在线风估计</text>
<text x="32" y="393" font-size="18">主分数：全航期的实际服务时间。局部诊断：同一快照下只切换规划读出，比较选层。</text><text x="32" y="421" font-size="15" fill="#596c71">示意航迹，并非实验结果。每一对独立天气和起点只提供一对寿命差值。</text></g></svg>
