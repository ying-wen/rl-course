<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 415" width="870" height="415" role="img" aria-labelledby="title desc"><title id="title">技能完成时间与成功的联合分布</title><desc id="desc">两项技能均以一半概率成功，时长分布也相同。A的成功发生在第一步，B的成功发生在第三步，因而只有A能在两步内成功。</desc><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="870" height="415" rx="5" fill="white"/><text x="32" y="43" font-size="27" fill="#203b48" text-anchor="start" font-weight="650">相同的成功率，两种不同的技能</text><text x="32" y="73" font-size="17" fill="#203b48" text-anchor="start" font-weight="450">四条路径从同一起点出发。每项技能内，两条路径各以 ½ 的概率发生。</text><rect x="138" y="122" width="396" height="194" rx="5" fill="#eaf5f1"/><path d="M535,109 L535,318" stroke="#315764" stroke-width="2" stroke-dasharray="5 5" fill="none"/><text x="139" y="109" font-size="15" fill="#203b48" text-anchor="middle" font-weight="450">启动</text><text x="337" y="109" font-size="15" fill="#203b48" text-anchor="middle" font-weight="450">第 1 步</text><text x="535" y="109" font-size="15" fill="#203b48" text-anchor="middle" font-weight="450">第 2 步 · 截止</text><text x="733" y="109" font-size="15" fill="#203b48" text-anchor="middle" font-weight="450">第 3 步</text><path d="M139,148 L337,148" stroke="#5b7483" stroke-width="2" stroke-dasharray="" fill="none"/><circle cx="139" cy="148" r="4" fill="#466274"/><circle cx="337" cy="148" r="9" fill="#007468"/><text x="353" y="154" font-size="16" fill="#007468" text-anchor="start" font-weight="450">成功</text><path d="M139,190 L733,190" stroke="#5b7483" stroke-width="2" stroke-dasharray="" fill="none"/><circle cx="139" cy="190" r="4" fill="#466274"/><path d="M727,184 l12,12 m-12,0 l12,-12" fill="none" stroke="#9d4254" stroke-width="3"/><text x="749" y="196" font-size="16" fill="#9d4254" text-anchor="start" font-weight="450">失败</text><path d="M139,243 L337,243" stroke="#5b7483" stroke-width="2" stroke-dasharray="" fill="none"/><circle cx="139" cy="243" r="4" fill="#466274"/><path d="M331,237 l12,12 m-12,0 l12,-12" fill="none" stroke="#9d4254" stroke-width="3"/><text x="353" y="249" font-size="16" fill="#9d4254" text-anchor="start" font-weight="450">失败</text><path d="M139,285 L733,285" stroke="#5b7483" stroke-width="2" stroke-dasharray="" fill="none"/><circle cx="139" cy="285" r="4" fill="#466274"/><circle cx="733" cy="285" r="9" fill="#007468"/><text x="749" y="291" font-size="16" fill="#007468" text-anchor="start" font-weight="450">成功</text><text x="33" y="175" font-size="21" fill="#203b48" text-anchor="start" font-weight="600">技能 A</text><text x="33" y="268" font-size="21" fill="#203b48" text-anchor="start" font-weight="600">技能 B</text><path d="M30,215 L839,215" stroke="#dce5e8" stroke-width="1" stroke-dasharray="" fill="none"/><rect x="30" y="327" width="807" height="70" rx="5" fill="#f2f5f7"/><text x="48" y="354" font-size="17" fill="#203b48" text-anchor="start" font-weight="620">只看最终成功和用时</text><text x="293" y="354" font-size="17" fill="#203b48" text-anchor="start" font-weight="450">两者成功率均为 ½，用时均为 1 或 3 步。</text><text x="48" y="382" font-size="17" fill="#203b48" text-anchor="start" font-weight="620">只计两步内的成功</text><text x="293" y="382" font-size="17" fill="#203b48" text-anchor="start" font-weight="450">A 有一条合格路径（½）；B 的成功都在截止之后（0）。</text></g></svg>