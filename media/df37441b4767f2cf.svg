<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 836" width="880" height="836" role="img"><title>抓取失败的鉴别与无重置作业的全程净收益</title><desc>标准抓取对三种单一异常给出相同失败概率。测指垫、核零点分别区分磨损和漂移。图示留出班次10000的实际模拟轨迹，以及每种策略在512个同工时留出班次的表现。</desc><rect x="0" y="0" width="880" height="836" rx="0" fill="white" stroke="none" /><text x="27" y="36" fill="#152e40" font-size="26" font-weight="650" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一次抓取失败，三种可能的物理变化</text><text x="28" y="66" fill="#152e40" font-size="17" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">标准抓取失败概率 0.72。工件、指垫或零点中仅一项异常时，这个读数完全相同。</text><rect x="28" y="89" width="259" height="151" rx="8" fill="#f4f8fa" stroke="#d7e3e8" /><text x="43" y="117" fill="#152e40" font-size="18" font-weight="650" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">工件表面变化</text><line x1="210" y1="108" x2="218" y2="101" stroke="#166a62" stroke-width="2" stroke-linecap="round" /><line x1="219" y1="108" x2="227" y2="101" stroke="#166a62" stroke-width="2" stroke-linecap="round" /><line x1="228" y1="108" x2="236" y2="101" stroke="#166a62" stroke-width="2" stroke-linecap="round" /><line x1="237" y1="108" x2="245" y2="101" stroke="#166a62" stroke-width="2" stroke-linecap="round" /><line x1="205" y1="114" x2="253" y2="114" stroke="#166a62" stroke-width="4" stroke-linecap="round" /><text x="43" y="148" fill="#4d6272" font-size="15" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">标准 / 柔顺成功率</text><text x="43" y="178" fill="#166a62" font-size="23" font-weight="650" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">0.28 / 0.86</text><line x1="43" y1="192" x2="270" y2="192" stroke="#b5c7cf" stroke-width="1.4" stroke-linecap="round" /><text x="43" y="219" fill="#152e40" font-size="17" font-weight="560" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">复用柔顺抓取</text><rect x="311" y="89" width="259" height="151" rx="8" fill="#f4f8fa" stroke="#d7e3e8" /><text x="326" y="117" fill="#152e40" font-size="18" font-weight="650" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">指垫磨损</text><line x1="484" y1="101" x2="534" y2="101" stroke="#166a62" stroke-width="3" stroke-linecap="round" /><line x1="489" y1="105" x2="489" y2="109" stroke="#166a62" stroke-width="4" stroke-linecap="round" /><line x1="501" y1="105" x2="501" y2="113" stroke="#166a62" stroke-width="4" stroke-linecap="round" /><line x1="513" y1="105" x2="513" y2="109" stroke="#166a62" stroke-width="4" stroke-linecap="round" /><line x1="525" y1="105" x2="525" y2="113" stroke="#166a62" stroke-width="4" stroke-linecap="round" /><text x="326" y="148" fill="#4d6272" font-size="15" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">测垫显示磨损</text><text x="326" y="178" fill="#166a62" font-size="23" font-weight="650" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">0.91</text><line x1="326" y1="192" x2="553" y2="192" stroke="#b5c7cf" stroke-width="1.4" stroke-linecap="round" /><text x="326" y="219" fill="#152e40" font-size="17" font-weight="560" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">更换指垫，再操作</text><rect x="594" y="89" width="259" height="151" rx="8" fill="#f4f8fa" stroke="#d7e3e8" /><text x="609" y="117" fill="#152e40" font-size="18" font-weight="650" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">传感器零点漂移</text><line x1="766" y1="110" x2="822" y2="110" stroke="#166a62" stroke-width="2" stroke-linecap="round" /><line x1="770" y1="105" x2="770" y2="110" stroke="#166a62" stroke-width="1.5" stroke-linecap="round" /><line x1="781" y1="105" x2="781" y2="110" stroke="#166a62" stroke-width="1.5" stroke-linecap="round" /><line x1="792" y1="105" x2="792" y2="110" stroke="#166a62" stroke-width="1.5" stroke-linecap="round" /><line x1="803" y1="105" x2="803" y2="110" stroke="#166a62" stroke-width="1.5" stroke-linecap="round" /><line x1="814" y1="105" x2="814" y2="110" stroke="#166a62" stroke-width="1.5" stroke-linecap="round" /><circle cx="801" cy="106" r="4" fill="#a65329" /><text x="609" y="148" fill="#4d6272" font-size="15" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">零点检查呈阳性</text><text x="609" y="178" fill="#166a62" font-size="23" font-weight="650" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">0.94</text><line x1="609" y1="192" x2="836" y2="192" stroke="#b5c7cf" stroke-width="1.4" stroke-linecap="round" /><text x="609" y="219" fill="#152e40" font-size="17" font-weight="560" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">重新标定，再操作</text><text x="28" y="270" fill="#4d6272" font-size="15" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">探测只增加观测。换垫和标定改变其中一个部件。多种异常可以并存。</text><line x1="28" y1="288" x2="851" y2="288" stroke="#b5c7cf" stroke-width="1.4" stroke-linecap="round" /><text x="28" y="321" fill="#152e40" font-size="22" font-weight="650" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">同一作业流中的一次标定</text><text x="28" y="345" fill="#4d6272" font-size="15" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">较高故障率，首个留出班次。横向长度表示实际占用工时。</text><rect x="33" y="377" width="110" height="66" rx="5" fill="#faeee7" stroke="none" /><text x="88.0" y="403" fill="#152e40" font-size="16" font-weight="550" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">柔顺抓取</text><text x="88.0" y="428" fill="#4d6272" font-size="15" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">失败</text><text x="33" y="369" fill="#4d6272" font-size="14" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">16</text><rect x="148" y="377" width="110" height="66" rx="5" fill="#faeee7" stroke="none" /><text x="203.0" y="403" fill="#152e40" font-size="16" font-weight="550" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">柔顺抓取</text><text x="203.0" y="428" fill="#4d6272" font-size="15" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">失败</text><text x="148" y="369" fill="#4d6272" font-size="14" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">17</text><rect x="263" y="377" width="110" height="66" rx="5" fill="#e3edf5" stroke="none" /><text x="318.0" y="403" fill="#152e40" font-size="16" font-weight="550" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">核零点</text><text x="318.0" y="428" fill="#4d6272" font-size="15" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">阳性</text><text x="263" y="369" fill="#4d6272" font-size="14" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">18</text><rect x="378" y="377" width="340" height="66" rx="5" fill="#e3edf5" stroke="none" /><text x="548.0" y="403" fill="#152e40" font-size="16" font-weight="550" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">重新标定</text><text x="548.0" y="428" fill="#4d6272" font-size="15" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">3 步</text><text x="378" y="369" fill="#4d6272" font-size="14" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">19</text><rect x="723" y="377" width="110" height="66" rx="5" fill="#e7f3ef" stroke="none" /><text x="778.0" y="403" fill="#152e40" font-size="16" font-weight="550" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">柔顺抓取</text><text x="778.0" y="428" fill="#4d6272" font-size="15" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">成功</text><text x="723" y="369" fill="#4d6272" font-size="14" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">22</text><text x="838" y="369" fill="#4d6272" font-size="14" font-weight="400" text-anchor="end" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">23</text><text x="32" y="472" fill="#152e40" font-size="16" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">核零点前后，漂移概率 0.36 → 0.90。标定完成后漂移概率为零，磨损概率仍为 0.21。</text><line x1="28" y1="495" x2="851" y2="495" stroke="#b5c7cf" stroke-width="1.4" stroke-linecap="round" /><text x="28" y="529" fill="#152e40" font-size="22" font-weight="650" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">相同 160 个时步内的净收益</text><text x="28" y="554" fill="#4d6272" font-size="15" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每次交付 +1，失败 −0.15，另扣干预成本。标定或换垫时，工位无法交付。</text><line x1="295.6" y1="583" x2="295.6" y2="753" stroke="#dee8ec" stroke-width="1" stroke-linecap="round" /><text x="295.6" y="580" fill="#4d6272" font-size="14" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">70</text><line x1="398.79999999999995" y1="583" x2="398.79999999999995" y2="753" stroke="#dee8ec" stroke-width="1" stroke-linecap="round" /><text x="398.79999999999995" y="580" fill="#4d6272" font-size="14" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">80</text><line x1="502.0" y1="583" x2="502.0" y2="753" stroke="#dee8ec" stroke-width="1" stroke-linecap="round" /><text x="502.0" y="580" fill="#4d6272" font-size="14" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">90</text><line x1="605.2" y1="583" x2="605.2" y2="753" stroke="#dee8ec" stroke-width="1" stroke-linecap="round" /><text x="605.2" y="580" fill="#4d6272" font-size="14" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">100</text><line x1="708.4000000000001" y1="583" x2="708.4000000000001" y2="753" stroke="#dee8ec" stroke-width="1" stroke-linecap="round" /><text x="708.4000000000001" y="580" fill="#4d6272" font-size="14" font-weight="400" text-anchor="middle" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">110</text><text x="32" y="609" fill="#152e40" font-size="16" font-weight="600" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">按价值选择</text><line x1="404.7443199999999" y1="604" x2="707.74984" y2="604" stroke="#b1bfc8" stroke-width="2" stroke-linecap="round" /><circle cx="404.7443199999999" cy="604" r="5.4" fill="#a65329" /><circle cx="707.74984" cy="604" r="5.4" fill="#22608c" /><text x="393.7443199999999" y="609" fill="#a65329" font-size="14" font-weight="600" text-anchor="end" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">80.6</text><text x="718.74984" y="609" fill="#22608c" font-size="14" font-weight="600" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">109.9</text><text x="32" y="643" fill="#152e40" font-size="16" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">定期探测¹</text><line x1="398.91351999999995" y1="638" x2="704.3236" y2="638" stroke="#b1bfc8" stroke-width="2" stroke-linecap="round" /><circle cx="398.91351999999995" cy="638" r="5.4" fill="#a65329" /><circle cx="704.3236" cy="638" r="5.4" fill="#22608c" /><text x="387.91351999999995" y="643" fill="#a65329" font-size="14" font-weight="600" text-anchor="end" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">80.0</text><text x="715.3236" y="643" fill="#22608c" font-size="14" font-weight="600" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">109.6</text><text x="32" y="677" fill="#152e40" font-size="16" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">定期探测（须测）</text><line x1="388.43871999999993" y1="672" x2="687.9044799999999" y2="672" stroke="#b1bfc8" stroke-width="2" stroke-linecap="round" /><circle cx="388.43871999999993" cy="672" r="5.4" fill="#a65329" /><circle cx="687.9044799999999" cy="672" r="5.4" fill="#22608c" /><text x="377.43871999999993" y="677" fill="#a65329" font-size="14" font-weight="600" text-anchor="end" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">79.0</text><text x="698.9044799999999" y="677" fill="#22608c" font-size="14" font-weight="600" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">108.0</text><text x="32" y="711" fill="#152e40" font-size="16" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">定期标定</text><line x1="296.2604799999999" y1="706" x2="635.2931199999999" y2="706" stroke="#b1bfc8" stroke-width="2" stroke-linecap="round" /><circle cx="296.2604799999999" cy="706" r="5.4" fill="#a65329" /><circle cx="635.2931199999999" cy="706" r="5.4" fill="#22608c" /><text x="285.2604799999999" y="711" fill="#a65329" font-size="14" font-weight="600" text-anchor="end" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">70.1</text><text x="646.2931199999999" y="711" fill="#22608c" font-size="14" font-weight="600" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">102.9</text><text x="32" y="745" fill="#152e40" font-size="16" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">两者定期</text><line x1="295.4452" y1="740" x2="635.52016" y2="740" stroke="#b1bfc8" stroke-width="2" stroke-linecap="round" /><circle cx="295.4452" cy="740" r="5.4" fill="#a65329" /><circle cx="635.52016" cy="740" r="5.4" fill="#22608c" /><text x="284.4452" y="745" fill="#a65329" font-size="14" font-weight="600" text-anchor="end" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">70.0</text><text x="646.52016" y="745" fill="#22608c" font-size="14" font-weight="600" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">102.9</text><circle cx="39" cy="775" r="5" fill="#a65329" /><text x="52" y="780" fill="#a65329" font-size="15" font-weight="550" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">较高故障率</text><circle cx="176" cy="775" r="5" fill="#22608c" /><text x="189" y="780" fill="#22608c" font-size="15" font-weight="550" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">较低故障率</text><text x="344" y="780" fill="#4d6272" font-size="15" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">每点为 512 个留出班次的均值。</text><text x="29" y="811" fill="#4d6272" font-size="15" font-weight="400" text-anchor="start" font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif">¹ 调参允许不做专门探测，两种工况均选中这一频率。抓取成败仍用于更新信念。</text></svg>