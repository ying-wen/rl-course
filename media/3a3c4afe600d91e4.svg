<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="406" viewBox="0 0 1100 406" role="img" aria-labelledby="title explanation"><title id="title">固定经验下的学习与自主交互中的学习</title><desc id="explanation">左图从同一份学习器状态出发，用两种更新在相同的可用样本上学习，再在独立样本上测量。右图让两个学习器采取行动，因策略变化取得不同经验，按相同期限结算各自的实际主奖励。线和符号表示信息的来源，不是实测曲线。</desc><defs><marker id="t" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 z" fill="#086b68"/></marker><marker id="b" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 z" fill="#235d85"/></marker><marker id="c" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 z" fill="#954f23"/></marker><marker id="m" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 z" fill="#456170"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Helvetica Neue,PingFang SC, sans-serif"><text x="15" y="34" text-anchor="start" font-weight="650" font-size="25" fill="#17364a">同一更新规则的两种检验</text><path d="M15 47 H1084" fill="none" stroke="#c5d5da" stroke-width="1.5" stroke-linejoin="round"/><path d="M544 64 V321" fill="none" stroke="#c5d5da" stroke-width="1.2" stroke-linejoin="round"/><text x="18" y="83" text-anchor="start" font-weight="650" font-size="23" fill="#086b68">固定经验　｜　每份样本产生多大改善</text><text x="575" y="83" text-anchor="start" font-weight="650" font-size="23" fill="#954f23">自主交互　｜　学到的改变是否改善行动</text><text x="18" y="117" text-anchor="start" font-weight="400" font-size="19" fill="#456170">从相同起点复制学习器，分别采用规则 F 和 G。</text><text x="575" y="117" text-anchor="start" font-weight="400" font-size="19" fill="#456170">从同一起始分布独立行动，沿各自的后果更新。</text><text x="169" y="159" text-anchor="middle" font-weight="500" font-size="15" fill="#456170">样本 1</text><path d="M169 166 V255" fill="none" stroke="#c5d5da" stroke-width="1" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="245" y="159" text-anchor="middle" font-weight="500" font-size="15" fill="#456170">样本 2</text><path d="M245 166 V255" fill="none" stroke="#c5d5da" stroke-width="1" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="321" y="159" text-anchor="middle" font-weight="500" font-size="15" fill="#456170">样本 3</text><path d="M321 166 V255" fill="none" stroke="#c5d5da" stroke-width="1" stroke-linejoin="round" stroke-dasharray="3 4"/><text x="20" y="204" text-anchor="start" font-weight="600" font-size="19" fill="#086b68">规则 F</text><path d="M96 198 H392" fill="none" stroke="#086b68" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#t)"/><circle cx="169" cy="198" r="7" fill="#086b68" stroke="#086b68" stroke-width="2.5"/><circle cx="245" cy="198" r="7" fill="white" stroke="#086b68" stroke-width="2.5"/><circle cx="321" cy="198" r="7" fill="#086b68" stroke="#086b68" stroke-width="2.5"/><text x="407" y="205" text-anchor="start" font-weight="600" font-size="19" fill="#086b68">后续误差</text><text x="20" y="259" text-anchor="start" font-weight="600" font-size="19" fill="#235d85">规则 G</text><path d="M96 253 H392" fill="none" stroke="#235d85" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#b)"/><circle cx="169" cy="253" r="7" fill="#235d85" stroke="#235d85" stroke-width="2.5"/><circle cx="245" cy="253" r="7" fill="white" stroke="#235d85" stroke-width="2.5"/><circle cx="321" cy="253" r="7" fill="#235d85" stroke="#235d85" stroke-width="2.5"/><text x="407" y="260" text-anchor="start" font-weight="600" font-size="19" fill="#235d85">后续误差</text><text x="18" y="297" text-anchor="start" font-weight="400" font-size="18" fill="#456170">也可固定规则，比较不同学习年龄的学习器。</text><text x="650" y="154" text-anchor="start" font-weight="400" font-size="15" fill="#456170">第一项行动</text><text x="828" y="154" text-anchor="start" font-weight="400" font-size="15" fill="#456170">下一份经验</text><text x="987" y="154" text-anchor="start" font-weight="400" font-size="15" fill="#456170">再行动</text><circle cx="602" cy="226" r="7" fill="#17364a" stroke="#17364a" stroke-width="2.5"/><path d="M610 226 L678 196 H1035" fill="none" stroke="#086b68" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#t)"/><path d="M610 226 L678 255 H1035" fill="none" stroke="#235d85" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#b)"/><text x="619" y="193" text-anchor="start" font-weight="600" font-size="17" fill="#086b68">F</text><circle cx="695" cy="196" r="7" fill="#086b68" stroke="#086b68" stroke-width="2.5"/><circle cx="859" cy="196" r="7" fill="#086b68" stroke="#086b68" stroke-width="2.5"/><circle cx="993" cy="196" r="7" fill="#086b68" stroke="#086b68" stroke-width="2.5"/><text x="619" y="268" text-anchor="start" font-weight="600" font-size="17" fill="#235d85">G</text><circle cx="695" cy="255" r="7" fill="#235d85" stroke="#235d85" stroke-width="2.5"/><circle cx="859" cy="255" r="7" fill="white" stroke="#235d85" stroke-width="2.5"/><circle cx="993" cy="255" r="7" fill="#235d85" stroke="#235d85" stroke-width="2.5"/><text x="575" y="297" text-anchor="start" font-weight="400" font-size="18" fill="#456170">试探、练习和恢复都占用两者各自的行动时间。</text><rect x="14" y="325" width="1071" height="66" rx="7" fill="#eff5f4"/><text x="29" y="352" text-anchor="start" font-weight="650" font-size="19" fill="#086b68">可塑性</text><text x="111" y="352" text-anchor="start" font-weight="400" font-size="19" fill="#17364a">读新问题的误差随样本数怎样变化</text><text x="574" y="352" text-anchor="start" font-weight="650" font-size="19" fill="#954f23">控制效用</text><text x="680" y="352" text-anchor="start" font-weight="400" font-size="19" fill="#17364a">读同一期限内实得主奖励的总和</text><text x="29" y="379" text-anchor="start" font-weight="400" font-size="18" fill="#456170">两项检验的差别在于：后续经验由谁选择，以及用什么量评价。</text></g></svg>