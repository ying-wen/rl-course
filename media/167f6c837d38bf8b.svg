<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="338" viewBox="0 0 1180 338" role="img" aria-labelledby="t d" lang="zh"><title id="t">发现规则与基准控制的全程收益</title><desc id="d">横轴是共同的原始时钟，线条表示两种规则会产生各自的经验。纵向起伏仅区别行动，不编码奖励大小。发现、探测和应用均从同一起点累计外部奖励。固定时刻 k 把总回报差分成 Δ₀:ₖ 与 Δₖ:T 两段。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#126c67"/></marker></defs><rect width="1180" height="338" fill="white"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif"><text x="22" y="40" text-anchor="start" font-size="29" fill="#16363b" font-weight="650">同一起点，同一真实交互期限</text><text x="1156" y="37" text-anchor="end" font-size="19" fill="#50676c" font-weight="470">示意 · 两条备选规则</text><g transform="translate(0,22)"><text x="20" y="101" text-anchor="start" font-size="24" fill="#126c67" font-weight="600">自主发现 L<tspan font-size="16" dy="6">D</tspan></text><text x="20" y="172" text-anchor="start" font-size="24" fill="#50676c" font-weight="600">基准控制 L<tspan font-size="16" dy="6">0</tspan></text><path d="M175 95 H1147" fill="none" stroke="#a2b5b5" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M175 165 H1147" fill="none" stroke="#a2b5b5" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/><path d="M175 95 H295" fill="none" stroke="#126c67" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M295 95 Q324 68 351 95 T409 95 H575" fill="none" stroke="#96602b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M575 95 Q665 62 731 92 T889 86 T1020 92 L1147 81" fill="none" stroke="#126c67" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><path d="M175 165 Q290 149 375 161 T540 161 T718 156 T924 160 L1147 153" fill="none" stroke="#50676c" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="175" cy="95" r="5" fill="white" stroke="#126c67" stroke-width="3"/><circle cx="175" cy="165" r="5" fill="white" stroke="#50676c" stroke-width="3"/><path d="M575 52 V185" fill="none" stroke="#a2b5b5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><path d="M1147 57 V186" fill="none" stroke="#a2b5b5" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4"/><text x="303" y="60" text-anchor="start" font-size="20" fill="#96602b" font-weight="430">构造、试用、等待反馈</text><text x="662" y="60" text-anchor="start" font-size="20" fill="#126c67" font-weight="430">在后来行动中使用或放弃</text><text x="175" y="204" text-anchor="middle" font-size="19" fill="#50676c" font-weight="470">0</text><text x="575" y="204" text-anchor="middle" font-size="20" fill="#50676c" font-weight="470">k</text><text x="1147" y="204" text-anchor="middle" font-size="20" fill="#50676c" font-weight="470">T</text><text x="1125" y="204" text-anchor="end" font-size="19" fill="#50676c" font-weight="430">共同的原始时钟</text><g fill="none" stroke="#7d8b8f" stroke-width="1.6"><path d="M180 222 V230 H570 V222"/><path d="M580 222 V230 H1142 V222"/></g><text x="377" y="256" text-anchor="middle" font-size="20" fill="#96602b" font-weight="500">Δ<tspan font-size="14" dy="5">0:k</tspan><tspan dy="-5">：发现和检验占用的行动</tspan></text><text x="861" y="256" text-anchor="middle" font-size="20" fill="#126c67" font-weight="500">Δ<tspan font-size="14" dy="5">k:T</tspan><tspan dy="-5">：学成知识的后续使用</tspan></text></g><text x="21" y="322" text-anchor="start" font-size="23" fill="#16363b" font-weight="500">两段期望回报差相加，得到整个期限的净贡献。试用失败和错过的其他行动都进入比较。</text></g></svg>