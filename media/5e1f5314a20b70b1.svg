<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="345" viewBox="0 0 1230 345" role="img" aria-labelledby="t d" lang="zh"><title id="t">经验片段、检验构造与新反馈</title><desc id="d">左图是智能体自己执行过的两个片段。中图用二者组合一项尚待检验的探测策略 κ：先作a，见甲则作b，核验期限内有无乙。右图示意目前只在一种来路上有新结果，另一种来路的条件概率仍未定。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#126c67"/></marker></defs><rect width="1230" height="345" fill="white"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif"><text x="21" y="39" text-anchor="start" font-size="31" fill="#16363b" font-weight="650">已经发生的两段交互</text><text x="500" y="39" text-anchor="start" font-size="31" fill="#16363b" font-weight="650">组合成可执行的探测</text><text x="912" y="39" text-anchor="start" font-size="31" fill="#16363b" font-weight="650">以后的一次真实调用</text><path d="M36 129 H420" fill="none" stroke="#a2b5b5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M73 128 H201" fill="none" stroke="#126c67" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M241 128 H385" fill="none" stroke="#126c67" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="72" cy="128" r="7" fill="white" stroke="#126c67" stroke-width="3"/><circle cx="205" cy="128" r="8" fill="#126c67" stroke="#126c67" stroke-width="3"/><circle cx="239" cy="128" r="7" fill="white" stroke="#126c67" stroke-width="3"/><circle cx="388" cy="128" r="8" fill="#126c67" stroke="#126c67" stroke-width="3"/><text x="126" y="104" text-anchor="middle" font-size="22" fill="#126c67" font-weight="500">动作 a</text><text x="319" y="104" text-anchor="middle" font-size="22" fill="#126c67" font-weight="500">动作 b</text><text x="205" y="166" text-anchor="middle" font-size="23" fill="#16363b" font-weight="550">见甲</text><text x="389" y="166" text-anchor="middle" font-size="23" fill="#16363b" font-weight="550">见乙</text><text x="22" y="220" text-anchor="start" font-size="23" fill="#50676c" font-weight="430">各段分别发生，接续结果未知。</text><path d="M444 120 H478" fill="none" stroke="#126c67" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="515" y="87" text-anchor="start" font-size="27" fill="#126c67" font-weight="650" font-style="italic">κ</text><path d="M539 80 H566" fill="none" stroke="#126c67" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="578" y="88" text-anchor="start" font-size="25" fill="#16363b" font-weight="500">a</text><path d="M602 79 H641" fill="none" stroke="#126c67" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><circle cx="645" cy="79" r="6" fill="white" stroke="#126c67" stroke-width="3"/><path d="M651 79 H749" fill="none" stroke="#126c67" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="691" y="66" text-anchor="middle" font-size="18" fill="#126c67" font-weight="500">见甲</text><text x="764" y="88" text-anchor="start" font-size="26" fill="#16363b" font-weight="500">b</text><path d="M646 86 V119 H732" fill="none" stroke="#50676c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5"/><text x="741" y="127" text-anchor="start" font-size="19" fill="#50676c" font-weight="430">否则停止</text><text x="500" y="166" text-anchor="start" font-size="23" fill="#16363b" font-weight="430">E = 在调用期限内见乙</text><text x="500" y="215" text-anchor="start" font-size="21" fill="#50676c" font-weight="430">X = 启动前可辨认的历史特征</text><path d="M864 61 V241" fill="none" stroke="#96602b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 6"/><text x="852" y="268" text-anchor="end" font-size="19" fill="#96602b" font-weight="600">冻结 κ、E、X</text><text x="918" y="83" text-anchor="start" font-size="21" fill="#50676c" font-weight="430">旧状态相同，始于不同历史。</text><text x="920" y="139" text-anchor="start" font-size="23" fill="#126c67" font-weight="600">X = 0</text><text x="920" y="198" text-anchor="start" font-size="23" fill="#126c67" font-weight="600">X = 1</text><path d="M1000 131 H1078" fill="none" stroke="#126c67" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1000 190 H1078" fill="none" stroke="#126c67" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 6" marker-end="url(#arr)"/><text x="1038" y="118" text-anchor="middle" font-size="17" fill="#126c67" font-weight="600">执行 κ</text><text x="1094" y="139" text-anchor="start" font-size="22" fill="#16363b" font-weight="600">返回 Y</text><text x="1094" y="197" text-anchor="start" font-size="21" fill="#96602b" font-weight="600">仍缺样本</text><text x="916" y="250" text-anchor="start" font-size="20" fill="#50676c" font-weight="430">实线可评分，虚线尚未执行。</text><path d="M21 284 H1210" fill="none" stroke="#a2b5b5" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/><text x="26" y="322" text-anchor="start" font-size="23" fill="#16363b" font-weight="500">环境沿原时间继续运行。每次调用只产生选中行为的反馈；比较两类历史须有可比的后续调用。</text></g></svg>