 <text x="538" y="164" class="sub">已连接的两段</text><path d="M596 171v31" stroke="#637781" fill="none"/>
 <text x="786" y="257" class="cap new">接触与对准</text><path d="M790 240l-23-21" stroke="#a24e28" fill="none"/>
 <text x="573" y="326" class="sub">验收后的连接在下一工序中保留</text>
 <text x="532" y="388" class="lab">一次接合，改变下一次接触。</text><text x="532" y="414" class="sub">记录有效连接、恢复时间、损伤与接管。</text>
</g>
<path d="M25 456h950" fill="none" stroke="#ccd4d5"/><text x="32" y="489" class="lab">同一段真实时间里，探测和恢复都占用工作机会。</text>
<text x="32" y="521" class="cap">比较持续更新与强自适应控制器；在相同物理条件的独立副本中，再检验先前知识带来的收益。</text>
</svg>
