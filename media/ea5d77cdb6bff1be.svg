<svg xmlns="http://www.w3.org/2000/svg" width="1152" height="332" viewBox="0 0 1152 332" role="img" data-crl-visual="v1" aria-labelledby="title desc">
<title id="title">学习一个新方法，改变以后能够取得的经验</title>
<desc id="desc">左侧空心圆和菱形是两种不同的世界条件。原有动作让它们产生同一读数。中间的新方法由先前可做的动作组成，在不同条件下出现不同读数。右侧规划根据读数改选行动，两个虚线结果仍须独立执行检验。</desc>
<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#176d73" stroke-width="1.4"/></marker>
 <marker id="future" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#9a5525" stroke-width="1.4"/></marker>
</defs>
<style>
text{font-family:"PingFang SC","Noto Sans CJK SC",sans-serif;fill:#1c3940} .head{font-size:25px;font-weight:650} .tag{font-size:22px} .fine{font-size:20px;fill:#536b70} .wire{fill:none;stroke:#176d73;stroke-width:3.3;stroke-linecap:round;stroke-linejoin:round} .route{fill:none;stroke:#9a5525;stroke-width:3.3;stroke-dasharray:8 7;stroke-linecap:round}
</style>
<g id="known">
 <text class="head" x="35" y="43">原有经验</text>
 <circle cx="65" cy="116" r="10" fill="white" stroke="#29474d" stroke-width="3"/>
 <path d="M65 200l12 12-12 12-12-12z" fill="white" stroke="#29474d" stroke-width="3"/>
 <path class="wire" d="M83 116 C130 116 145 165 198 165 M83 212 C130 212 145 165 198 165" marker-end="url(#arrow)"/>
 <circle cx="218" cy="165" r="10" fill="#176d73"/>
 <text class="tag" x="164" y="203">同一读数</text>
 <text class="fine" x="35" y="292">已有行动分不清两种情形</text>
</g>
<path d="M318 72v169" stroke="#c5d3d0" stroke-width="1.6"/>
<g id="new-test">
 <text class="head" x="355" y="43">学习者形成新的检验</text>
 <path class="wire" d="M368 165 H399L424 143 456 180 486 151 512 165 H534"/>
 <g fill="white" stroke="#176d73" stroke-width="2.8"><circle cx="399" cy="165" r="5"/><circle cx="424" cy="143" r="5"/><circle cx="456" cy="180" r="5"/><circle cx="486" cy="151" r="5"/></g>
 <path d="M388 192v12h115v-12" fill="none" stroke="#71888a" stroke-width="1.8"/>
 <text class="fine" x="446" y="234" text-anchor="middle">组成并试用</text>
 <path class="wire" d="M535 165 C575 165 581 115 631 115 M535 165 C575 165 581 216 631 216" marker-end="url(#arrow)"/>
 <circle cx="650" cy="115" r="10" fill="white" stroke="#176d73" stroke-width="3"/>
 <path d="M650 203l12 12-12 12-12-12z" fill="white" stroke="#176d73" stroke-width="3"/>
 <text class="tag" x="674" y="121">读数甲</text><text class="tag" x="674" y="222">读数乙</text>
 <text class="fine" x="355" y="292">可用后续经验检验这个区别</text>
</g>
<path d="M779 72v169" stroke="#c5d3d0" stroke-width="1.6"/>
<g id="reachable">
 <text class="head" x="809" y="43">新条件下的行动</text>
 <path class="route" d="M822 115 C872 115 907 83 970 83" marker-end="url(#future)"/>
 <path class="route" d="M822 215 C872 215 907 247 970 247" marker-end="url(#future)"/>
 <text class="tag" x="986" y="90">结果一</text><text class="tag" x="986" y="254">结果二</text>
 <text class="fine" x="818" y="151">采用行动一</text><text class="fine" x="818" y="193">采用行动二</text>
 <text class="fine" x="809" y="292">可达性仍须实际行动核验</text>
</g>
</svg>
