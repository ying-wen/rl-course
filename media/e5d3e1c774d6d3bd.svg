<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="242" viewBox="0 0 1240 242" role="img" aria-labelledby="t d" lang="zh"><title id="t">智能体状态怎样进入预测、技能与规划</title><desc id="d">青线表示状态读取、真实技能执行的后果、模型备份和动作选择。金线从预测、技能和模型回到构建状态的递推参数，表示它们各自的学习信号在参数共享时还能改变今后的状态。</desc><defs><marker id="teal" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#086975"/></marker><marker id="amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#935618"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif"><text x="98" y="110" font-size="31" font-weight="640" fill="#173842" text-anchor="middle">智能体状态</text><text x="98" y="151" font-size="24" font-weight="450" fill="#4a6167" text-anchor="middle">观测递推</text><path d="M95 78 V36 H264" fill="none" stroke="#086975" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><path d="M200 105 H419" fill="none" stroke="#086975" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><text x="350" y="46" font-size="31" font-weight="640" fill="#173842" text-anchor="middle">预测答案</text><text x="652" y="28" font-size="23" font-weight="450" fill="#4a6167" text-anchor="middle">控制选择可读取已有预测</text><path d="M437 38 H966 Q979 38 979 50 V72" fill="none" stroke="#086975" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><text x="494" y="113" font-size="31" font-weight="640" fill="#173842" text-anchor="middle">运行技能</text><text x="741" y="113" font-size="31" font-weight="640" fill="#173842" text-anchor="middle">后果模型</text><text x="979" y="113" font-size="31" font-weight="640" fill="#173842" text-anchor="middle">主任务规划</text><text x="1166" y="113" font-size="31" font-weight="640" fill="#173842" text-anchor="middle">下次行动</text><path d="M566 103 H660" fill="none" stroke="#086975" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><text x="615" y="74" font-size="20" font-weight="450" fill="#086975" text-anchor="middle">实得后果</text><path d="M810 103 H876" fill="none" stroke="#086975" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><text x="843" y="74" font-size="20" font-weight="450" fill="#086975" text-anchor="middle">备份</text><path d="M1064 103 H1094" fill="none" stroke="#086975" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teal)"/><text x="1090" y="156" font-size="20" font-weight="450" fill="#4a6167" text-anchor="middle">所选技能发出原始动作</text><path d="M350 60 V182" fill="none" stroke="white" stroke-width="8"/><path d="M350 60 V182" fill="none" stroke="#935618" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="350" cy="182" r="4" fill="#935618"/><path d="M494 126 V182" fill="none" stroke="#935618" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="494" cy="182" r="4" fill="#935618"/><path d="M741 126 V182 H112 Q97 182 97 176 V166" fill="none" stroke="#935618" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#amber)"/><text x="620" y="225" font-size="25" font-weight="560" fill="#935618" text-anchor="middle">共享编码器时，预测误差、技能的学习信号和模型误差可更新状态递推参数</text></g></svg>