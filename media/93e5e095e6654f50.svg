<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img" aria-labelledby="title desc"><title id="title">同一采样分布，三个更新方向</title><desc id="desc">零奖励两站任务中，行为等概率向左或向右，目标总向右。共享参数为一时，X 站贡献正零点四，Y 站贡献负零点二。普通重要性采样 TD 的平均方向背离真值零。GTD 的理想负梯度和强调型 TD 的平均方向指向零。</desc><defs><marker id="blue" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#286485"/></marker><marker id="rust" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#b94b24"/></marker><marker id="green" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#177768"/></marker><marker id="gray" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#63778a"/></marker></defs><rect width="820" height="430" fill="#fbfcfb"/><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',Arial,sans-serif" fill="#1e3545"><text x="32" y="36" font-size="25" font-weight="600" text-anchor="start" fill="#1e3545">同一条经验流，三种更新方向</text><text x="32" y="69" font-size="17" font-weight="400" text-anchor="start" fill="#1e3545">奖励恒为 0，折扣为 0.9。行为等概率选左、右；目标策略总向右。</text><path d="M32 88 H788" fill="none" stroke="#c8d5d8" stroke-width="1"/><text x="36" y="119" font-size="18" font-weight="600" text-anchor="start" fill="#1e3545">两个状态共享一个权重 w</text><circle cx="108" cy="168" r="27" fill="#dcecf1" stroke="#286485" stroke-width="2"/><circle cx="284" cy="168" r="27" fill="#dcecf1" stroke="#286485" stroke-width="2"/><text x="108" y="175" font-size="20" font-weight="600" text-anchor="middle" fill="#1e3545">X</text><text x="284" y="175" font-size="20" font-weight="600" text-anchor="middle" fill="#1e3545">Y</text><path d="M140 167 H252" fill="none" stroke="#286485" stroke-width="2.3" marker-end="url(#blue)"/><path d="M296 144 C340 109 350 174 314 168" fill="none" stroke="#286485" stroke-width="2.1" marker-end="url(#blue)"/><text x="196" y="157" font-size="13" font-weight="400" text-anchor="middle" fill="#286485">目标动作</text><text x="108" y="218" font-size="16" font-weight="400" text-anchor="middle" fill="#1e3545">v(X) = w</text><text x="284" y="218" font-size="16" font-weight="400" text-anchor="middle" fill="#1e3545">v(Y) = 2w</text><text x="433" y="119" font-size="18" font-weight="600" text-anchor="start" fill="#1e3545">w = 1 时的普通 TD 平均方向</text><text x="433" y="157" font-size="16" font-weight="400" text-anchor="start" fill="#1e3545">X 站</text><text x="497" y="157" font-size="16" font-weight="400" text-anchor="start" fill="#1e3545">½ × (1.8 − 1) × 1</text><text x="727" y="157" font-size="18" font-weight="600" text-anchor="start" fill="#b94b24">+0.4</text><text x="433" y="186" font-size="16" font-weight="400" text-anchor="start" fill="#1e3545">Y 站</text><text x="497" y="186" font-size="16" font-weight="400" text-anchor="start" fill="#1e3545">½ × (1.8 − 2) × 2</text><text x="727" y="186" font-size="18" font-weight="600" text-anchor="start" fill="#177768">−0.2</text><path d="M431 197 H778" fill="none" stroke="#c8d5d8" stroke-width="1"/><text x="433" y="221" font-size="15" font-weight="400" text-anchor="start" fill="#1e3545">按行为访问频率相加</text><text x="727" y="221" font-size="18" font-weight="600" text-anchor="start" fill="#b94b24">+0.2</text><path d="M32 240 H788" fill="none" stroke="#c8d5d8" stroke-width="1"/><text x="35" y="270" font-size="17" font-weight="600" text-anchor="start" fill="#1e3545">箭头给出平均方向的符号</text><text x="486" y="267" font-size="14" font-weight="500" text-anchor="middle" fill="#286485">真值 w = 0</text><text x="35" y="310" font-size="16" font-weight="400" text-anchor="start" fill="#1e3545">重要性采样 TD(0)</text><text x="253" y="310" font-size="16" font-weight="500" text-anchor="start" fill="#1e3545">+0.2 w</text><path d="M379 305 H601" fill="none" stroke="#c8d5d8" stroke-width="1.3"/><circle cx="486" cy="305" r="5" fill="white" stroke="#286485" stroke-width="2"/><path d="M462 305 H406" fill="none" stroke="#b94b24" stroke-width="3" marker-end="url(#rust)"/><path d="M512 305 H567" fill="none" stroke="#b94b24" stroke-width="3" marker-end="url(#rust)"/><text x="630" y="310" font-size="16" font-weight="600" text-anchor="start" fill="#b94b24">离开零</text><text x="35" y="354" font-size="16" font-weight="400" text-anchor="start" fill="#1e3545">GTD2 的理想负梯度</text><text x="253" y="354" font-size="16" font-weight="500" text-anchor="start" fill="#1e3545">−0.016 w</text><path d="M379 349 H601" fill="none" stroke="#c8d5d8" stroke-width="1.3"/><circle cx="486" cy="349" r="5" fill="white" stroke="#286485" stroke-width="2"/><path d="M406 349 H462" fill="none" stroke="#177768" stroke-width="3" marker-end="url(#green)"/><path d="M567 349 H512" fill="none" stroke="#177768" stroke-width="3" marker-end="url(#green)"/><text x="630" y="354" font-size="16" font-weight="600" text-anchor="start" fill="#177768">趋向零</text><text x="35" y="398" font-size="16" font-weight="400" text-anchor="start" fill="#1e3545">ETD(0) 的平均方向</text><text x="253" y="398" font-size="16" font-weight="500" text-anchor="start" fill="#1e3545">−3.4 w</text><path d="M379 393 H601" fill="none" stroke="#c8d5d8" stroke-width="1.3"/><circle cx="486" cy="393" r="5" fill="white" stroke="#286485" stroke-width="2"/><path d="M406 393 H462" fill="none" stroke="#177768" stroke-width="3" marker-end="url(#green)"/><path d="M567 393 H512" fill="none" stroke="#177768" stroke-width="3" marker-end="url(#green)"/><text x="630" y="398" font-size="16" font-weight="600" text-anchor="start" fill="#177768">趋向零</text></g></svg>