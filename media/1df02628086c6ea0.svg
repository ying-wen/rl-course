<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="318" viewBox="0 0 1250 318" role="img" aria-labelledby="t d" lang="zh"><title id="t">发现规则的学习与三种控制检验</title><desc id="d">左侧是从同一历史抽取的组合，一项得到练习，虚线分支没有反馈。中间用同一实际后果评分，再在同一规划起点比较有无该知识的行动。右侧只有实际执行的行动产生主奖励。返回的金色箭头表示后续主奖励经产生式与练习选择的对数概率导数改变下次发现。</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 1L9 5L0 9Z" fill="#126c67"/></marker></defs><rect width="1250" height="318" fill="white"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif"><text x="25" y="36" text-anchor="start" font-size="25" fill="#16363b" font-weight="650">发现时刻</text><text x="435" y="36" text-anchor="start" font-size="25" fill="#16363b" font-weight="650">预测和规划</text><text x="893" y="36" text-anchor="start" font-size="25" fill="#16363b" font-weight="650">外部行动与主奖励</text><circle cx="65" cy="134" r="9" fill="#126c67" stroke="#126c67" stroke-width="3"/><path d="M75 134 Q120 134 145 93 H195" fill="none" stroke="#126c67" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M75 134 Q120 134 145 169 H199" fill="none" stroke="#50676c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 6"/><text x="25" y="113" text-anchor="start" font-size="20" fill="#16363b" font-weight="430">历史</text><text x="197" y="99" text-anchor="start" font-size="22" fill="#126c67" font-weight="600">提出预测 q</text><text x="199" y="177" text-anchor="start" font-size="19" fill="#50676c" font-weight="430">另一种组合</text><path d="M331 91 H411" fill="none" stroke="#126c67" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="343" y="73" text-anchor="start" font-size="17" fill="#126c67" font-weight="430">选用</text><text x="430" y="92" text-anchor="start" font-size="20" fill="#50676c" font-weight="430">旧预测</text><text x="432" y="142" text-anchor="start" font-size="20" fill="#126c67" font-weight="600">新预测</text><path d="M501 86 H585" fill="none" stroke="#50676c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="562" cy="86" r="6" fill="white" stroke="#50676c" stroke-width="3"/><path d="M501 135 H585" fill="none" stroke="#126c67" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle cx="580" cy="135" r="6" fill="#126c67" stroke="#126c67" stroke-width="3"/><path d="M597 68 V152" fill="none" stroke="#96602b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3"/><text x="554" y="175" text-anchor="start" font-size="18" fill="#96602b" font-weight="430">实际后果</text><path d="M650 91 H677" fill="none" stroke="#126c67" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="689" y="97" text-anchor="start" font-size="20" fill="#16363b" font-weight="430">规划比较</text><path d="M705 113 Q725 147 772 147" fill="none" stroke="#50676c" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 5"/><text x="786" y="154" text-anchor="start" font-size="21" fill="#50676c" font-weight="430">a</text><path d="M770 91 H825" fill="none" stroke="#126c67" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><text x="838" y="97" text-anchor="start" font-size="23" fill="#126c67" font-weight="650">b</text><path d="M867 91 H919" fill="none" stroke="#126c67" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><path d="M935 92 H1221" fill="none" stroke="#126c67" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#arr)"/><circle cx="948" cy="92" r="6" fill="#126c67" stroke="#126c67" stroke-width="3"/><circle cx="1005" cy="92" r="6" fill="#126c67" stroke="#126c67" stroke-width="3"/><circle cx="1060" cy="92" r="6" fill="#126c67" stroke="#126c67" stroke-width="3"/><circle cx="1119" cy="92" r="6" fill="#126c67" stroke="#126c67" stroke-width="3"/><circle cx="1175" cy="92" r="6" fill="#126c67" stroke="#126c67" stroke-width="3"/><text x="1075" y="137" text-anchor="middle" font-size="19" fill="#16363b" font-weight="500">实际取得的主奖励</text><text x="1068" y="169" text-anchor="middle" font-size="18" fill="#50676c" font-weight="450">含生成、练习占用的时间</text><path d="M1205 98 V206 Q1205 224 1183 224 H149 Q128 224 128 245 V258" fill="none" stroke="#96602b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><path d="M121 249 L128 261 L135 249" fill="none" stroke="#96602b" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"/><text x="458" y="215" text-anchor="start" font-size="21" fill="#96602b" font-weight="620">后续回报为此前的生成和练习选择分配信用</text><text x="25" y="292" text-anchor="start" font-size="23" fill="#16363b" font-weight="650">下一次发现</text><text x="194" y="292" text-anchor="start" font-size="22" fill="#16363b" font-weight="430">组合与练习的概率随元参数改变。</text><text x="766" y="292" text-anchor="start" font-size="19" fill="#50676c" font-weight="430">虚线表示未执行的备选，回报未知。</text></g></svg>