<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
<title id="title">同一经验流中的三种结束</title><desc id="desc">在同一次运行中，第二步的可测事件结束一个预测，第四步技能终止交还动作选择权，第五步研究者停止计分。三者都不重置环境。第六步仍承接第五步的物理状态和学习器记忆。</desc>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4 0 8" fill="none" stroke="#38535b" stroke-width="1.2"/></marker></defs>
<rect x="0" y="0" width="1000" height="440" rx="14" fill="#f8faf7"/>
<g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#17383b">
<text x="27" y="42" font-size="28" font-weight="680">一个预测到期，不等于一个世界终止</text>
<text x="27" y="73" font-size="17" fill="#486467">沿同一条真实运行对齐：点是收到反馈的时刻，相邻两点之间执行一次原始动作。</text>
<g stroke="#c2d2ce" stroke-width="1" stroke-dasharray="2 5"><path d="M270 128V357M365 128V357M460 128V357M555 128V357M650 128V357M745 128V357M840 128V357"/></g>
<text x="27" y="124" font-size="20" font-weight="650">外部交互</text>
<path d="M263 117H939" stroke="#38535b" stroke-width="2" marker-end="url(#arr)"/>
<g fill="#244c53"><circle cx="270" cy="117" r="5"/><text x="270" y="147" text-anchor="middle" font-size="15">0</text><circle cx="365" cy="117" r="5"/><text x="365" y="147" text-anchor="middle" font-size="15">1</text><circle cx="460" cy="117" r="5"/><text x="460" y="147" text-anchor="middle" font-size="15">2</text><circle cx="555" cy="117" r="5"/><text x="555" y="147" text-anchor="middle" font-size="15">3</text><circle cx="650" cy="117" r="5"/><text x="650" y="147" text-anchor="middle" font-size="15">4</text><circle cx="745" cy="117" r="5"/><text x="745" y="147" text-anchor="middle" font-size="15">5</text><circle cx="840" cy="117" r="5"/><text x="840" y="147" text-anchor="middle" font-size="15">6</text></g>
<text x="27" y="199" font-size="19" font-weight="650">预测：事件首次发生</text><path d="M270 193H460" stroke="#238078" stroke-width="9" stroke-linecap="round"/>
<circle cx="460" cy="193" r="9" fill="#238078"/><text x="482" y="199" font-size="17">读出信号；该次预测的延续系数为零</text>
<text x="27" y="266" font-size="19" font-weight="650">技能：内部策略执行</text><path d="M270 259H650" stroke="#bb6c33" stroke-width="9" stroke-linecap="round"/><path d="M650 249 660 259 650 269 640 259Z" fill="#9a5222"/><text x="672" y="265" font-size="17">交还控制；选择下一技能</text>
<text x="27" y="329" font-size="19" font-weight="650">评价：前五步累计奖励</text><path d="M270 306V325H745V306" stroke="#446d88" stroke-width="4" fill="none"/><text x="763" y="330" font-size="17">窗口截止</text>
<path d="M270 365H935" stroke="#38535b" stroke-width="2" marker-end="url(#arr)"/>
<text x="27" y="372" font-size="19" font-weight="650">学习器与世界</text>
<text x="28" y="411" font-size="18" fill="#224f4c">下一步从已经到达的位置继续，也保留至今学得的状态、参数和技能。</text></g></svg>