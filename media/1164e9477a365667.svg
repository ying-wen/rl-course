<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="516" viewBox="0 0 1030 516" role="img" aria-labelledby="title desc"><title id="title">同一次技能执行的原始步、完成样本和模型期望</title><desc id="desc">上半图是从 A 到 C 的一段执行轨迹。末步奖励三，剩余时长预测只再计一步；整段持续七步，高层控制在 C 继续。下半图将同一旧奖励率和尾值代入真实完成样本与更新前的模型均值。</desc><rect width="100%" height="100%" fill="#fcfcf8"/><g font-family="PingFang SC,Hiragino Sans GB,sans-serif" fill="#172f3a"><text x="25" y="41" font-size="30" font-weight="650" fill="#182f3a">一次到站，两种时间尺度</text><text x="25" y="76" font-size="19" font-weight="400" fill="#3d606c">三站任务  ·  种子 0  ·  从 A 到 C 的一次技能执行</text><line x1="92" y1="134" x2="187" y2="134" stroke="#9caeac" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/><text x="133" y="119" font-size="19" font-weight="400" fill="#3d606c">0</text><line x1="201" y1="134" x2="296" y2="134" stroke="#9caeac" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/><text x="242" y="119" font-size="19" font-weight="400" fill="#3d606c">0</text><line x1="310" y1="134" x2="405" y2="134" stroke="#9caeac" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/><text x="351" y="119" font-size="19" font-weight="400" fill="#3d606c">0</text><line x1="419" y1="134" x2="514" y2="134" stroke="#9caeac" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/><text x="460" y="119" font-size="19" font-weight="400" fill="#3d606c">0</text><line x1="528" y1="134" x2="623" y2="134" stroke="#9caeac" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/><text x="569" y="119" font-size="19" font-weight="400" fill="#3d606c">0</text><line x1="637" y1="134" x2="732" y2="134" stroke="#9caeac" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/><text x="678" y="119" font-size="19" font-weight="400" fill="#3d606c">0</text><line x1="746" y1="134" x2="841" y2="134" stroke="#006c67" stroke-width="5" stroke-linecap="round" stroke-dasharray=""/><text x="787" y="119" font-size="19" font-weight="650" fill="#9a5529">3</text><circle cx="85" cy="134" r="9" fill="#006c67" stroke="none" stroke-width="2"/><circle cx="194" cy="134" r="5" fill="#738c92" stroke="none" stroke-width="2"/><circle cx="303" cy="134" r="5" fill="#738c92" stroke="none" stroke-width="2"/><circle cx="412" cy="134" r="5" fill="#738c92" stroke="none" stroke-width="2"/><circle cx="521" cy="134" r="5" fill="#738c92" stroke="none" stroke-width="2"/><circle cx="630" cy="134" r="5" fill="#738c92" stroke="none" stroke-width="2"/><circle cx="739" cy="134" r="5" fill="#738c92" stroke="none" stroke-width="2"/><circle cx="848" cy="134" r="9" fill="#006c67" stroke="none" stroke-width="2"/><text x="28" y="120" font-size="15" font-weight="400" fill="#3d606c">奖励</text><text x="67" y="164" font-size="17" font-weight="400" fill="#182f3a">A 出发</text><text x="803" y="164" font-size="17" font-weight="400" fill="#182f3a">C 交回控制</text><line x1="860" y1="134" x2="940" y2="134" stroke="#3d606c" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 4"/><text x="917" y="118" font-size="16" font-weight="400" fill="#3d606c">下个技能</text><line x1="86" y1="192" x2="845" y2="192" stroke="#3d606c" stroke-width="1.5" stroke-linecap="round" stroke-dasharray=""/><line x1="86" y1="184" x2="86" y2="192" stroke="#3d606c" stroke-width="1.5" stroke-linecap="round" stroke-dasharray=""/><line x1="845" y1="184" x2="845" y2="192" stroke="#3d606c" stroke-width="1.5" stroke-linecap="round" stroke-dasharray=""/><text x="238" y="219" font-size="19" font-weight="650" fill="#3d606c">全程奖励  G = 3</text><text x="506" y="219" font-size="19" font-weight="650" fill="#3d606c">持续时间  τ = 7 步</text><text x="24" y="254" font-size="19" font-weight="400" fill="#182f3a">到 C 为止的时长预测，在末步的样本目标为 1；高层动作价值还要计入 C 以后的行动。</text><rect x="23" y="277" width="481" height="142" rx="11" fill="#e8f2ef"/><rect x="517" y="277" width="490" height="142" rx="11" fill="#ecf1f6"/><text x="40" y="309" font-size="22" font-weight="650" fill="#006c67">一次实际执行</text><text x="537" y="309" font-size="22" font-weight="650" fill="#345c74">模型对同一技能的估计</text><text x="39" y="348" font-size="24" font-weight="400" fill="#182f3a">3  −  7 × 0.2864  −  0.8307</text><text x="537" y="348" font-size="21" font-weight="400" fill="#182f3a">3.0056  −  7.5623 × 0.2864  −  0.8307</text><text x="40" y="390" font-size="22" font-weight="650" fill="#006c67">样本目标  ≈  0.1647</text><text x="537" y="390" font-size="22" font-weight="650" fill="#345c74">模型目标  ≈  0.0092</text><text x="25" y="457" font-size="18" font-weight="400" fill="#182f3a">固定同一组更新前的估计：每步奖励率 0.2864，到站后最佳动作的差分价值 −0.8307。</text><text x="25" y="488" font-size="18" font-weight="400" fill="#3d606c">两列都算“累计奖励 − 耗时 × 奖励率 + 后继价值”。右列的奖励和耗时来自此前完成的行程。</text></g></svg>