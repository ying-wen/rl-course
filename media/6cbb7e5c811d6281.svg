<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="320" viewBox="0 0 1100 320" role="img" aria-labelledby="title desc"><title id="title">技能替换后，旧估计影响控制的两条路径</title><desc id="desc">当前状态 s 的旧技能估值 1.1 高于原始动作 1，新技能真实价值为 0。直接用于选择会试用新技能；即便没有试用，在前驱的最大值目标中读取旧值，也可把差额传播到前驱。固定另一条路径，分别改变两处读数，再比较整个学习期间的实际奖励。</desc><defs><marker id="t" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#086755"/></marker><marker id="g" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#935319"/></marker><marker id="r" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#9a3942"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif"><rect x="12" y="10" width="1076" height="49" rx="9" fill="#f1f4f5" stroke="#d3dfe2" stroke-width="1.5"/><text x="30" y="42" fill="#19344a" font-size="23" font-weight="600">同一状态 s　｜　原始动作价值 1　　旧技能估计 1.1　　新技能真实价值 0（仅供分析）</text><rect x="14" y="111" width="270" height="95" rx="9" fill="#f9f3e8" stroke="#d9be98" stroke-width="1.5"/><text x="32" y="147" fill="#935319" font-size="23" font-weight="650">技能策略已替换</text><text x="32" y="183" fill="#19344a" font-size="22" font-weight="400">估计仍保留 1.1</text><path d="M284 160 H310 V109 H338" fill="none" stroke="#086755" stroke-width="2.8" stroke-linecap="round" marker-end="url(#t)" /><path d="M310 160 V212 H338" fill="none" stroke="#9a3942" stroke-width="2.8" stroke-linecap="round" marker-end="url(#r)" /><rect x="345" y="75" width="315" height="72" rx="9" fill="#e8f4f1" stroke="#a7cfc2" stroke-width="1.5"/><text x="367" y="104" fill="#086755" font-size="22" font-weight="650">行动选择　1.1 &gt; 1</text><text x="367" y="132" fill="#19344a" font-size="20" font-weight="400">当步贪心选择新技能</text><rect x="345" y="178" width="315" height="74" rx="9" fill="#f9eded" stroke="#d5a8ad" stroke-width="1.5"/><text x="367" y="207" fill="#9a3942" font-size="22" font-weight="650">前驱更新　max(1, 1.1)</text><text x="367" y="237" fill="#19344a" font-size="19" font-weight="400">尚未执行也可进入自举目标</text><path d="M660 109 H710" fill="none" stroke="#086755" stroke-width="2.8" stroke-linecap="round" marker-end="url(#t)" /><path d="M660 212 H710" fill="none" stroke="#9a3942" stroke-width="2.8" stroke-linecap="round" marker-end="url(#r)" /><text x="730" y="102" fill="#086755" font-size="23" font-weight="650">实际试用可取得新后果</text><text x="730" y="135" fill="#475f69" font-size="18" font-weight="400">失败成本和再次观测机会均由行为决定。</text><text x="730" y="207" fill="#9a3942" font-size="23" font-weight="650">前驱目标增加 0.1 γ</text><text x="730" y="239" fill="#475f69" font-size="18" font-weight="400">以同一转移、同一奖励及其他估值为准。</text><path d="M16 270 H1082" fill="none" stroke="#d2dede" stroke-width="2.8" stroke-linecap="round" /><text x="26" y="302" fill="#19344a" font-size="22" font-weight="650">对照　</text><text x="105" y="302" fill="#19344a" font-size="20" font-weight="400">分别切换两处读取；另留试用机会。按相同原始步数比较各学习器的实得主奖励。</text></g></svg>