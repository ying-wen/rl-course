<svg xmlns="http://www.w3.org/2000/svg" width="980" height="408" viewBox="0 0 980 408" role="img" aria-labelledby="mt md"><title id="mt">同一条转移的三种用途</title><desc id="md">经验提供可观测事件和实际奖励。预测与技能分别学习后果与行为；外部价值决定如何行动；后续奖励为比较更新规则提供信号。</desc><defs><marker id="a" viewBox="0 0 7 7" refX="6" refY="3.5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L7 3.5 L0 7Z" fill="#206879"/></marker></defs><rect x="0" y="0" width="980" height="408" fill="white"/><rect x="12" y="101" width="195" height="112" rx="8" fill="#f1f7f7" stroke="#91acb1"/><text x="26" y="129" fill="#154e60" font-size="19" font-weight="650" text-anchor="start" font-family="Helvetica Neue, PingFang SC, sans-serif">真实交互</text><text x="26" y="154" fill="#193944" font-size="15" font-weight="400" text-anchor="start" font-family="Helvetica Neue, PingFang SC, sans-serif">执行原始动作 Aₜ</text><text x="26" y="177" fill="#193944" font-size="15" font-weight="400" text-anchor="start" font-family="Helvetica Neue, PingFang SC, sans-serif">收到 Oₜ₊₁ 与 Rₜ₊₁</text><rect x="268" y="18" width="294" height="95" rx="8" fill="#f1f7f7" stroke="#91acb1"/><text x="282" y="46" fill="#154e60" font-size="19" font-weight="650" text-anchor="start" font-family="Helvetica Neue, PingFang SC, sans-serif">预期后果</text><text x="282" y="71" fill="#193944" font-size="15" font-weight="400" text-anchor="start" font-family="Helvetica Neue, PingFang SC, sans-serif">GVF：指定行为和累积量</text><text x="282" y="94" fill="#193944" font-size="15" font-weight="400" text-anchor="start" font-family="Helvetica Neue, PingFang SC, sans-serif">GQ：按目标策略评价后续行为</text><rect x="268" y="142" width="294" height="95" rx="8" fill="#f1f7f7" stroke="#91acb1"/><text x="282" y="170" fill="#154e60" font-size="19" font-weight="650" text-anchor="start" font-family="Helvetica Neue, PingFang SC, sans-serif">可执行的技能</text><text x="282" y="195" fill="#193944" font-size="15" font-weight="400" text-anchor="start" font-family="Helvetica Neue, PingFang SC, sans-serif">DCEO：沿谱坐标练习</text><text x="282" y="218" fill="#193944" font-size="15" font-weight="400" text-anchor="start" font-family="Helvetica Neue, PingFang SC, sans-serif">Wayfarer：按主价值决定调用</text><rect x="644" y="71" width="315" height="124" rx="8" fill="#f1f7f7" stroke="#91acb1"/><text x="658" y="99" fill="#154e60" font-size="19" font-weight="650" text-anchor="start" font-family="Helvetica Neue, PingFang SC, sans-serif">当前行为的选择</text><text x="658" y="124" fill="#193944" font-size="15" font-weight="400" text-anchor="start" font-family="Helvetica Neue, PingFang SC, sans-serif">差分 Q：按单位时间奖励比较</text><text x="658" y="147" fill="#193944" font-size="15" font-weight="400" text-anchor="start" font-family="Helvetica Neue, PingFang SC, sans-serif">GSP：用子目标模型向前规划</text><text x="658" y="170" fill="#193944" font-size="15" font-weight="400" text-anchor="start" font-family="Helvetica Neue, PingFang SC, sans-serif">SF–GPI：换奖励后重估旧策略</text><path d="M207 155 H234 V65 H264" stroke="#206879" stroke-width="2.4" fill="none" marker-end="url(#a)"/><path d="M234 155 V189 H264" stroke="#206879" stroke-width="2.4" fill="none" marker-end="url(#a)"/><path d="M562 65 H598 V112 H640" stroke="#206879" stroke-width="2.4" fill="none" marker-end="url(#a)"/><path d="M562 188 H598 V156 H640" stroke="#206879" stroke-width="2.4" fill="none" marker-end="url(#a)"/><text x="18" y="270" fill="#914121" font-size="18" font-weight="650" text-anchor="start" font-family="Helvetica Neue, PingFang SC, sans-serif">学习规则作用于上述估计的更新</text><path d="M800 195 V276" stroke="#206879" stroke-width="2.4" fill="none" marker-end="url(#a)"/><rect x="456" y="280" width="503" height="94" rx="8" fill="#fbf6ed" stroke="#91acb1"/><text x="470" y="308" fill="#154e60" font-size="19" font-weight="650" text-anchor="start" font-family="Helvetica Neue, PingFang SC, sans-serif">后续交互评定更新规则</text><text x="470" y="333" fill="#193944" font-size="15" font-weight="400" text-anchor="start" font-family="Helvetica Neue, PingFang SC, sans-serif">Stream-X 调节每步写入；DiscoRL 用学习后的回报训练目标生成器。</text><text x="470" y="356" fill="#193944" font-size="15" font-weight="400" text-anchor="start" font-family="Helvetica Neue, PingFang SC, sans-serif">前者是流式单步机制；后者在发现阶段使用多个智能体。</text><rect x="12" y="290" width="377" height="82" rx="8" fill="#f5f5f2" stroke="#91acb1"/><text x="26" y="318" fill="#154e60" font-size="19" font-weight="650" text-anchor="start" font-family="Helvetica Neue, PingFang SC, sans-serif">全程评价</text><text x="26" y="343" fill="#193944" font-size="15" font-weight="400" text-anchor="start" font-family="Helvetica Neue, PingFang SC, sans-serif">从第一次行动累计主奖励；包括探索与练习所耗时间。</text><path d="M456 330 H394" stroke="#206879" stroke-width="2.4" fill="none" marker-end="url(#a)"/><text x="18" y="398" fill="#506770" font-size="15" font-weight="400" text-anchor="start" font-family="Helvetica Neue, PingFang SC, sans-serif">读图：上半部区分所学的对象；下半部区分怎样更新，以及按什么标准评价学习器。</text></svg>