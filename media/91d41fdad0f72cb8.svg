<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" lang="zh" viewBox="0 0 1140 205" width="1140" height="205"><title id="t">同一对探测与沿用规则的回报差区间</title><desc id="d">三栏横轴都是探测规则减沿用规则的全程回报差 Δₑ，向右表示探测更好；竖虚线代表零，粗线段是各相容环境上 Δₑ 的共同区间 [l, u]。左栏 l 大于零，选探测；中栏 l 不大于零而 u 大于零，两项规则的次序未定；右栏 u 不大于零，沿用现有控制。三栏为判定示意。</desc><defs><marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9Z" fill="#7d8b8f"/></marker></defs><rect width="1140" height="205" fill="white"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif" fill="#18313a"><g transform="translate(0,0)"><text text-anchor="middle" x="190" y="34" font-size="27" font-weight="650">选探测</text><text text-anchor="middle" x="190" y="70" font-size="24" font-weight="600" fill="#077b70" ><tspan font-style="italic" font-family="Times New Roman,serif">l</tspan> &gt; 0</text><path d="M30 146H346" stroke="#a6b1b4" stroke-width="2.2" marker-end="url(#ax)"/><path d="M190 84V160" stroke="#50646a" stroke-width="2" stroke-dasharray="5 5"/><text text-anchor="middle" x="190" y="188" font-size="23">0</text><g stroke="#077b70" stroke-width="6" stroke-linecap="round"><path d="M213 121H307"/><path d="M213 108V134 M307 108V134"/></g><text text-anchor="middle" x="213" y="101" font-size="22" font-style="italic" font-family="Times New Roman,serif" fill="#077b70">l</text><text text-anchor="middle" x="307" y="101" font-size="22" font-style="italic" font-family="Times New Roman,serif" fill="#077b70">u</text><text x="350" y="188" text-anchor="end" fill="#50646a" font-size="23">Δ<tspan font-size="16" dy="5">e</tspan></text></g><g transform="translate(380,0)"><text text-anchor="middle" x="190" y="34" font-size="27" font-weight="650">两项规则的次序未定</text><text text-anchor="middle" x="190" y="70" font-size="24" font-weight="600" fill="#aa762e" ><tspan font-style="italic" font-family="Times New Roman,serif">l</tspan> ≤ 0 &lt; <tspan font-style="italic" font-family="Times New Roman,serif">u</tspan></text><path d="M30 146H346" stroke="#a6b1b4" stroke-width="2.2" marker-end="url(#ax)"/><path d="M190 84V160" stroke="#50646a" stroke-width="2" stroke-dasharray="5 5"/><text text-anchor="middle" x="190" y="188" font-size="23">0</text><g stroke="#aa762e" stroke-width="6" stroke-linecap="round"><path d="M101 121H254"/><path d="M101 108V134 M254 108V134"/></g><text text-anchor="middle" x="101" y="101" font-size="22" font-style="italic" font-family="Times New Roman,serif" fill="#aa762e">l</text><text text-anchor="middle" x="254" y="101" font-size="22" font-style="italic" font-family="Times New Roman,serif" fill="#aa762e">u</text><text x="350" y="188" text-anchor="end" fill="#50646a" font-size="23">Δ<tspan font-size="16" dy="5">e</tspan></text></g><g transform="translate(760,0)"><text text-anchor="middle" x="190" y="34" font-size="27" font-weight="650">沿用现有控制</text><text text-anchor="middle" x="190" y="70" font-size="24" font-weight="600" fill="#3c6477" ><tspan font-style="italic" font-family="Times New Roman,serif">u</tspan> ≤ 0</text><path d="M30 146H346" stroke="#a6b1b4" stroke-width="2.2" marker-end="url(#ax)"/><path d="M190 84V160" stroke="#50646a" stroke-width="2" stroke-dasharray="5 5"/><text text-anchor="middle" x="190" y="188" font-size="23">0</text><g stroke="#3c6477" stroke-width="6" stroke-linecap="round"><path d="M66 121H157"/><path d="M66 108V134 M157 108V134"/></g><text text-anchor="middle" x="66" y="101" font-size="22" font-style="italic" font-family="Times New Roman,serif" fill="#3c6477">l</text><text text-anchor="middle" x="157" y="101" font-size="22" font-style="italic" font-family="Times New Roman,serif" fill="#3c6477">u</text><text x="350" y="188" text-anchor="end" fill="#50646a" font-size="23">Δ<tspan font-size="16" dy="5">e</tspan></text></g></g></svg>