<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="530" viewBox="0 0 1080 530" role="img" aria-labelledby="title desc"><title id="title">原始步、技能终止与规划</title><desc id="desc">同一个技能执行三步。每一步提供预测和控制的更新目标；在第三步停止时才获得技能的完整奖励、时长和停点。模型评价后续可行行为，实际选择决定下一份经验。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#477171"/></marker></defs><rect width="1080" height="530" fill="#fbfcf9"/><g font-family="PingFang SC, Microsoft YaHei, sans-serif"><text x="35" y="47" font-size="32" font-weight="650" fill="#1d3540" text-anchor="start">同一段经验，两种时间尺度</text><text x="35" y="84" font-size="21" font-weight="400" fill="#50646a" text-anchor="start">技能从 t 时刻启动，在第三个原始动作后终止。每个实点都是实际获得的观测。</text><circle cx="130" cy="158" r="8" fill="#096b70"/><text x="130" y="140" font-size="19" font-weight="650" fill="#1d3540" text-anchor="middle">t</text><circle cx="362" cy="158" r="8" fill="#096b70"/><text x="362" y="140" font-size="19" font-weight="650" fill="#1d3540" text-anchor="middle">t + 1</text><circle cx="594" cy="158" r="8" fill="#096b70"/><text x="594" y="140" font-size="19" font-weight="650" fill="#1d3540" text-anchor="middle">t + 2</text><circle cx="826" cy="158" r="8" fill="#096b70"/><text x="826" y="140" font-size="19" font-weight="650" fill="#1d3540" text-anchor="middle">t + 3</text><path d="M142 158 h202" fill="none" stroke="#477171" stroke-width="2.5" marker-end="url(#arr)"/><text x="244" y="191" font-size="17" font-weight="400" fill="#50646a" text-anchor="middle">动作 → 奖励、观测</text><path d="M374 158 h202" fill="none" stroke="#477171" stroke-width="2.5" marker-end="url(#arr)"/><text x="476" y="191" font-size="17" font-weight="400" fill="#50646a" text-anchor="middle">动作 → 奖励、观测</text><path d="M606 158 h202" fill="none" stroke="#477171" stroke-width="2.5" marker-end="url(#arr)"/><text x="708" y="191" font-size="17" font-weight="400" fill="#50646a" text-anchor="middle">动作 → 奖励、观测</text><path d="M834 158 h175" fill="none" stroke="#477171" stroke-width="2.5" marker-end="url(#arr)"/><text x="927" y="140" font-size="17" font-weight="400" fill="#096b70" text-anchor="middle">下一次选择</text><path d="M130 213 v12 H826 v-12" fill="none" stroke="#90561c" stroke-width="2.5"/><text x="477" y="255" font-size="19" font-weight="650" fill="#90561c" text-anchor="middle">同一次技能调用</text><rect x="33" y="278" width="487" height="122" rx="8" fill="#e5f2f0"/><rect x="545" y="278" width="500" height="122" rx="8" fill="#f5ebdc"/><text x="53" y="311" font-size="22" font-weight="650" fill="#096b70" text-anchor="start">每个原始步</text><text x="53" y="343" font-size="19" font-weight="400" fill="#1d3540" text-anchor="start">用观测递推状态，用主奖励估计动作价值。</text><text x="53" y="374" font-size="18" font-weight="400" fill="#50646a" text-anchor="start">同一转移还可按指定的信号与时域更新 GVF。</text><text x="565" y="311" font-size="22" font-weight="650" fill="#90561c" text-anchor="start">技能终止时</text><text x="565" y="343" font-size="18" font-weight="400" fill="#1d3540" text-anchor="start">累计奖励、实际步数和停点构成一个模型样本。</text><text x="565" y="374" font-size="18" font-weight="400" fill="#50646a" text-anchor="start">内部策略的练习使用为该技能定义的子任务。</text><path d="M289 401 v19 H530 v15" fill="none" stroke="#477171" stroke-width="2.5" marker-end="url(#arr)"/><path d="M794 401 v19 H531" fill="none" stroke="#477171" stroke-width="2.5"/><text x="543" y="460" font-size="21" font-weight="650" fill="#1d3540" text-anchor="middle">决策时读取价值与模型，比较下一步可采取的行为。</text><text x="543" y="500" font-size="19" font-weight="400" fill="#50646a" text-anchor="middle">实际执行的行为继续产生经验；模型内的模拟只占用计算。</text></g></svg>