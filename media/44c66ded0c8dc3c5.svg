<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title id="title">两段历史共用一个状态</title><desc id="desc">两段历史分别支持动作 a 和 b。合并状态后，即使最优决策仍会在其中一种历史承担损失。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#48646c"/></marker></defs><style>text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#19333e}.head{font-size:25px;font-weight:650}.label{font-size:20px;font-weight:650}.body{font-size:17px}.note{font-size:16px;fill:#4c646a}.line{fill:none;stroke:#48646c;stroke-width:2.4;marker-end:url(#arrow)}</style><rect width="900" height="330" fill="#fafaf6"/><text x="25" y="42" class="head" text-anchor="start">同一状态只能给出一种动作分布</text><rect x="24" y="75" width="218" height="76" rx="9" fill="#edf3ef" stroke="#a6bbb7"/><text x="39" y="104" class="label" text-anchor="start">历史一　概率 p</text><text x="39" y="132" class="body" text-anchor="start">选 a 更好，优势 g₁</text><rect x="24" y="180" width="218" height="76" rx="9" fill="#edf3ef" stroke="#a6bbb7"/><text x="39" y="209" class="label" text-anchor="start">历史二　概率 1−p</text><text x="39" y="237" class="body" text-anchor="start">选 b 更好，优势 g₂</text><rect x="315" y="122" width="165" height="82" rx="9" fill="#dbece9" stroke="#a6bbb7"/><text x="397" y="155" class="label" text-anchor="middle">共同状态 z</text><text x="397" y="183" class="body" text-anchor="middle">以概率 q 选 a</text><path d="M242 114 L307 149" class="line"/><path d="M242 218 L307 179" class="line"/><path d="M481 148 L557 112" class="line"/><path d="M481 177 L557 214" class="line"/><rect x="565" y="71" width="310" height="80" rx="9" fill="#f7ece0" stroke="#a6bbb7"/><text x="580" y="101" class="label" text-anchor="start">总选 a　即 πₐ = 1</text><text x="580" y="129" class="body" text-anchor="start">损失 (1−p)g₂，来自历史二</text><rect x="565" y="177" width="310" height="80" rx="9" fill="#f7ece0" stroke="#a6bbb7"/><text x="580" y="207" class="label" text-anchor="start">总选 b　即 πₐ = 0</text><text x="580" y="235" class="body" text-anchor="start">损失 pg₁，来自历史一</text><text x="25" y="301" class="note" text-anchor="start">任意随机化的损失位于两端点之间；最好的共同选择仍损失 min{pg₁, (1−p)g₂}。</text></svg>
