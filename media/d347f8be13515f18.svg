<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="title desc"><title id="title">同一个体内的细胞、组织与身体</title><desc id="desc">体内嵌套框表示细胞在回路内、回路在个体内。环境中可感的气味进入感受器，体内信号引起动作，动作改变感受器下一次采样的位置。</desc><defs><marker id="tip" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L12 6 L0 12z" fill="#346b62"/></marker></defs><style>text{font-family:"PingFang SC",sans-serif;fill:#234442}.h{font-size:20px;font-weight:600}.s{font-size:16px}.a{stroke:#346b62;fill:none;stroke-width:2.6;marker-end:url(#tip)}</style>
<rect x="2" y="2" width="816" height="326" rx="14" fill="#f8f9f4"/><text x="24" y="34" class="h">外部环境 · 空间中分布的食物与气味</text>
<rect x="86" y="57" width="658" height="188" rx="35" fill="#e6efe9" stroke="#8dac9d"/><text x="110" y="90" class="h">整只个体</text><rect x="158" y="104" width="453" height="115" rx="20" fill="#fff" stroke="#a9c1b8"/><text x="180" y="132" class="s">感觉、整合与运动通路</text>
<rect x="181" y="152" width="125" height="47" rx="22" fill="#d5e9df" stroke="#6d9b89"/><text x="244" y="182" text-anchor="middle" class="s">感受器细胞</text>
<path class="a" d="M309 175h47"/><circle cx="385" cy="175" r="21" fill="#eccb9f"/><text x="385" y="180" text-anchor="middle" style="font-size:15px;fill:#563f25">可塑</text><path class="a" d="M409 175h39"/><rect x="458" y="152" width="122" height="47" rx="22" fill="#d5e9df" stroke="#6d9b89"/><text x="519" y="182" text-anchor="middle" class="s">运动输出</text>
<text x="16" y="151" class="s">当地气味</text><path class="a" d="M28 176h143"/><path class="a" d="M585 176h57"/><text x="649" y="181" class="s">身体位移</text><path class="a" d="M689 204v63q0 17-18 17H67q-19 0-19-20v-67"/><text x="404" y="309" text-anchor="middle" class="s">移动改变采样位置，也改变下一步的感觉输入</text></svg>
