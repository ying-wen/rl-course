<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="430" viewBox="0 0 1180 430"
     role="img" aria-labelledby="ttl desc" xml:lang="zh-CN">
  <title id="ttl">从一条真实经验流发现、练习和维护有用的知识</title>
  <desc id="desc">来路线索 X 在决策之前可见，两种来路被当前状态 Z 合并。只有实走动作带来奖励与观测。示意样本中，在同一转角按同一策略走两步，甲来路四次中一次限时到站，乙来路四次中三次限时到站；未试行动的后果仍未知。若探测预期带来的以后收益值得付出代价，可以实际去试。到站事件 E 可分别用于固定 (π_q, C, Γ) 的首次命中预测，以及以提高到站率为目标、有停止规则的技能练习。当技能由 o 改为 o′，在同一起点、期限和尾值下比较备份。以下是教学算例，两个版本的真实备份从一变为零，跨过备选行动的二分之一。若旧模型对新版各行动的分数误差至多为 ε，旧排序间隔 d 大于 2ε 即可保留原排序；其余情形单凭此界尚未确定；根据探测价值决定是否再试，影响以后行动。练习和照常行动分支都从同一起点按相同寿命计分，包含探测、练习、恢复及此后的每一步实际主奖励。</desc>
  <defs>
    <marker id="teal-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.7" markerHeight="5.7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#086755"/>
    </marker>
    <marker id="gray-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5.7" markerHeight="5.7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#67777e"/>
    </marker>
    <g id="hit"><circle r="7.3" fill="#086755"/></g>
    <g id="miss"><circle r="6.7" fill="white" stroke="#657981" stroke-width="1.8"/></g>
  </defs>
  <rect width="1180" height="430" fill="white"/>
  <g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" fill="#19344a">
    <!-- One realized interaction. The alternative ends before any environment response. -->
    <g font-size="24" font-weight="650" text-anchor="middle">
      <text x="132" y="36">来路线索 X</text>
      <text x="329" y="36">当前观测 Oₜ</text>
      <text x="516" y="36">实走动作 Aₜ</text>
      <text x="754" y="36">收到 Rₜ₊₁、Oₜ₊₁</text>
      <text x="1039" y="36">以后的行动</text>
    </g>
    <path d="M39 57H1136" fill="none" stroke="#086755" stroke-width="3.7" marker-end="url(#teal-arrow)"/>
    <g fill="#086755"><circle cx="132" cy="57" r="6"/><circle cx="329" cy="57" r="6"/>
      <circle cx="516" cy="57" r="6"/><circle cx="754" cy="57" r="6"/><circle cx="1039" cy="57" r="6"/></g>
    <path d="M329 57C369 57 378 93 417 93H490" fill="none" stroke="#67777e" stroke-width="2.1" stroke-dasharray="7 5" marker-end="url(#gray-arrow)"/>
    <text x="506" y="101" font-size="21" fill="#455965">未试的动作：后果未知</text>
    <text x="34" y="100" font-size="21" fill="#455965">X 在行动前可记入状态</text>
    <path d="M1137 344H1145Q1155 344 1155 334V92Q1155 73 1135 73H1074" fill="none" stroke="#086755" stroke-width="2" marker-end="url(#teal-arrow)"/>
    <path d="M32 122H1130" stroke="#c9d8d8" stroke-width="1.4"/>
    <!-- The worked example gives EMPIRICAL counts, not exact conditional probabilities. -->
    <text x="32" y="159" font-size="25" font-weight="650">同一状态 Z 下的两类来路</text>
    <text x="32" y="189" font-size="20" fill="#455965">同一策略走两步，实心为限时到站</text>
    <g font-size="21">
      <text x="239" y="211" font-size="16" fill="#455965">示意命中频率</text>
      <text x="33" y="231">甲来路</text><text x="33" y="272">乙来路</text>
      <text x="238" y="231">1 / 4 次命中</text><text x="238" y="272">3 / 4 次命中</text>
    </g>
    <g transform="translate(120 223)">
      <use href="#hit"/><use href="#miss" x="27"/><use href="#miss" x="54"/><use href="#miss" x="81"/>
    </g>
    <g transform="translate(120 264)">
      <use href="#hit"/><use href="#hit" x="27"/><use href="#hit" x="54"/><use href="#miss" x="81"/>
    </g>
    <g font-size="20" fill="#455965">
      <text x="32" y="311">探测会占用以后的行动机会。</text>
      <text x="32" y="340">预期收益值得付出代价时才探测。</text>
    </g>
    <!-- One event, two distinct ways of using it. -->
    <text x="402" y="159" font-size="25" font-weight="650">到站事件 E 的两种用途</text>
    <circle cx="427" cy="244" r="19" fill="#e6f3ef" stroke="#398b78" stroke-width="1.5"/>
    <text x="427" y="252" font-size="23" font-weight="650" fill="#086755" text-anchor="middle">E</text>
    <g fill="none" stroke="#086755" stroke-width="2" marker-end="url(#teal-arrow)">
      <path d="M447 241C464 236 464 205 483 205"/>
      <path d="M447 247C464 252 464 285 483 285"/>
    </g>
    <g font-size="23" font-weight="650">
      <text x="493" y="210">预测 · GVF</text>
      <text x="493" y="291">技能（option）</text>
    </g>
    <g font-size="20" fill="#455965">
      <text x="493" y="239">固定 (π<tspan font-size="14" dy="5">q</tspan><tspan dy="-5">, C, Γ)，估计到站率</tspan></text>
      <text x="493" y="320">学怎样走，到站或超时交回</text>
    </g>
    <!-- Scores in this example are assumed known only for explaining a reversal. -->
    <text x="785" y="159" font-size="25" font-weight="650">新版技能与备选动作的排序</text>
    <text x="785" y="189" font-size="20" fill="#455965">相同起点、期限 n、尾值 v</text>
    <path d="M804 249H1080" stroke="#67777e" stroke-width="1.7" stroke-dasharray="6 5"/>
    <text x="1088" y="254" fill="#455965" font-size="19">½</text>
    <path d="M835 219L1017 279" fill="none" stroke="#9a571e" stroke-width="3"/>
    <circle cx="835" cy="219" r="5.5" fill="#9a571e"/><circle cx="1017" cy="279" r="5.5" fill="#9a571e"/>
    <text x="848" y="219" font-size="20" fill="#824719">旧技能 o 得 1</text>
    <text x="1027" y="277" font-size="20" fill="#824719">o′ 得 0</text>
    <text x="795" y="272" font-size="18" fill="#455965">备选行动</text>
    <g font-size="20" fill="#455965">
      <text x="785" y="302">旧估计对新版的各项误差 ≤ ε。</text>
      <text x="785" y="327">旧间隔 d &gt; 2ε，排序保持。</text>
      <text x="785" y="352">其余尚未确定，按探测价值取舍。</text>
    </g>
    <!-- The resource cost enters through real elapsed steps and their rewards. -->
    <rect x="21" y="365" width="1138" height="54" rx="8" fill="#eaf4f1"/>
    <text x="38" y="400" font-size="23" font-weight="650" fill="#075d4d">全程主回报</text>
    <text x="187" y="400" font-size="24" fill="#19344a">J<tspan font-size="16" dy="5">T</tspan><tspan dy="-5"> = E[R₁ + ⋯ + R</tspan><tspan font-size="16" dy="5">T</tspan><tspan dy="-5">]</tspan></text>
    <text x="510" y="400" font-size="22">试练与照常行动均从出发计分，探测、练习也占原始步。</text>
  </g>
</svg>
