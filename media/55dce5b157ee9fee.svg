<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 313" role="img" aria-labelledby="t d"><title id="t">生成动作块、执行前缀与回报信用</title><desc id="d">动作块中五个命令只执行前两个；后续读数触发重规划，最终回报对上游决定供给信用。</desc><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="313" rx="14" fill="#f9fbf9" stroke="none"/><text x="28" y="39" font-size="25" fill="#173847" font-weight="680" text-anchor="start">生成动作块、执行前缀与回报信用</text><text x="31" y="87" font-size="17" fill="#007b71" font-weight="680" text-anchor="start">策略输出</text><text x="31" y="147" font-size="17" fill="#ae5425" font-weight="680" text-anchor="start">实际执行</text><text x="31" y="204" font-size="16" fill="#173847" font-weight="680" text-anchor="start">传感器 / 奖励</text><rect x="186" y="62" width="112" height="36" rx="10" fill="#eaf5f1" stroke="none"/><text x="242" y="86" font-size="16" fill="#007b71" font-weight="680" text-anchor="middle">靠近</text><rect x="313" y="62" width="112" height="36" rx="10" fill="#eaf5f1" stroke="none"/><text x="369" y="86" font-size="16" fill="#007b71" font-weight="680" text-anchor="middle">闭合</text><rect x="440" y="62" width="112" height="36" rx="10" fill="#eaf5f1" stroke="none"/><text x="496" y="86" font-size="16" fill="#007b71" font-weight="680" text-anchor="middle">抬升</text><rect x="567" y="62" width="112" height="36" rx="10" fill="#eaf5f1" stroke="none"/><text x="623" y="86" font-size="16" fill="#007b71" font-weight="680" text-anchor="middle">移向架位</text><rect x="694" y="62" width="112" height="36" rx="10" fill="#eaf5f1" stroke="none"/><text x="750" y="86" font-size="16" fill="#007b71" font-weight="680" text-anchor="middle">松开</text><rect x="186" y="122" width="112" height="36" rx="10" fill="#faf0e5" stroke="none"/><text x="242" y="146" font-size="16" fill="#ae5425" font-weight="680" text-anchor="middle">靠近</text><rect x="313" y="122" width="112" height="36" rx="10" fill="#faf0e5" stroke="none"/><text x="369" y="146" font-size="16" fill="#ae5425" font-weight="680" text-anchor="middle">闭合</text><path d="M427 143 L473 143" fill="none" stroke="#ae5425" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M464.4747547794049 148.22687228930658 L473 143 L464.4747547794049 137.77312771069342" fill="none" stroke="#ae5425" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><text x="487" y="146" font-size="16" fill="#ae5425" font-weight="410" text-anchor="start">触觉到达，提前重算</text><path d="M440 105 H803" fill="none" stroke="#516b72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><text x="584" y="178" font-size="15" fill="#516b72" font-weight="410" text-anchor="start">旧块尾段未执行</text><circle cx="360" cy="200" r="5" fill="#007b71"/><text x="374" y="205" font-size="15" fill="#173847" font-weight="410" text-anchor="start">检测到滑移</text><circle cx="695" cy="201" r="5" fill="#ae5425"/><text x="707" y="206" font-size="15" fill="#173847" font-weight="410" text-anchor="start">放置结果</text><path d="M690 216 L360 216" fill="none" stroke="#007b71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4"/><path d="M368.5252452205951 210.77312771069342 L360 216 L368.5252452205951 221.22687228930658" fill="none" stroke="#007b71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><text x="31" y="258" font-size="16" fill="#173847" font-weight="410" text-anchor="start">返回奖励进入早期命令的回报。只有当执行和反馈与未执行尾段条件独立时，</text><text x="31" y="283" font-size="16" fill="#173847" font-weight="410" text-anchor="start">才能在求策略梯度时对尾段积分，用已执行前缀的对数概率代替整块概率。</text></g></svg>