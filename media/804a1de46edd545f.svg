<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="462" viewBox="0 0 1120 462" role="img" aria-labelledby="title desc"><title id="title">经验支持范围内的两项预测误差，与范围外的一次行动选择</title><desc id="desc">左图两条可见历史汇入同一状态，对两组使用相同行为。旧预测点三，校准为点五；从历史提出一个二值记忆后，对两组分别预测点二与点八。中图用相同样本的平方损失展示两次改进。右图对于未尝试的行为，两种模型对原行为意见相同，对新行为意见相反。底部把真实探测和其后实得的主奖励纳入同一寿命。</desc><defs><marker id="b" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#455e69"/></marker><marker id="t" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#0e706c"/></marker><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#92521d"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif"><text x="16" y="34" font-size="24" font-weight="650" fill="#18384a" text-anchor="start">已有经验：两类历史各占一半，执行同一策略 u，观测二值后果 Y</text><path d="M17 49 H1102" fill="none" stroke="#c3d1d5" stroke-width="1"/><text x="20" y="85" font-size="22" font-weight="650" fill="#0e706c" text-anchor="start">历史被压缩为同一状态</text><text x="380" y="85" font-size="22" font-weight="650" fill="#0e706c" text-anchor="start">同一后果的预测损失</text><text x="772" y="85" font-size="22" font-weight="650" fill="#92521d" text-anchor="start">缺少另一种行为的经验</text><path d="M350 70 V303" fill="none" stroke="#d9e2e3" stroke-width="1"/><path d="M735 70 V303" fill="none" stroke="#d9e2e3" stroke-width="1"/><text x="20" y="117" font-size="18" font-weight="600" fill="#0e706c" text-anchor="start">X=0</text><path d="M27 139 H135" fill="none" stroke="#9db5bb" stroke-width="2"/><circle cx="34" cy="139" r="6" fill="#fff" stroke="#0e706c" stroke-width="2"/><circle cx="78" cy="139" r="6" fill="#fff" stroke="#0e706c" stroke-width="2"/><rect x="115" y="133" width="12" height="12" rx="7" fill="#0e706c"/><path d="M133 139 L195 182" fill="none" stroke="#455e69" stroke-width="2" marker-end="url(#b)"/><text x="20" y="207" font-size="18" font-weight="600" fill="#0e706c" text-anchor="start">X=1</text><path d="M27 229 H135" fill="none" stroke="#9db5bb" stroke-width="2"/><rect x="28" y="223" width="12" height="12" rx="7" fill="#0e706c"/><circle cx="78" cy="229" r="6" fill="#fff" stroke="#0e706c" stroke-width="2"/><rect x="115" y="223" width="12" height="12" rx="7" fill="#0e706c"/><path d="M133 229 L195 182" fill="none" stroke="#455e69" stroke-width="2" marker-end="url(#b)"/><circle cx="216" cy="182" r="18" fill="#e6f3ee" stroke="#0e706c" stroke-width="2"/><text x="216" y="189" font-size="22" font-weight="650" fill="#0e706c" text-anchor="middle">z</text><path d="M237 182 H308" fill="none" stroke="#0e706c" stroke-width="2" marker-end="url(#t)"/><text x="271" y="161" font-size="21" font-weight="600" fill="#0e706c" text-anchor="middle">u</text><text x="22" y="279" font-size="17" font-weight="400" fill="#455e69" text-anchor="start">X 是行动前从历史构造的候选记忆。</text><text x="381" y="125" font-size="16" font-weight="400" fill="#455e69" text-anchor="start">预测</text><text x="572" y="125" font-size="16" font-weight="400" fill="#455e69" text-anchor="start">期望平方损失</text><text x="380" y="160" font-size="19" font-weight="400" fill="#18384a" text-anchor="start">原预测  0.30</text><rect x="574" y="145" width="100" height="15" rx="7" fill="#a0b0b7"/><text x="688" y="160" font-size="18" font-weight="600" fill="#18384a" text-anchor="start">0.29</text><text x="380" y="204" font-size="19" font-weight="400" fill="#18384a" text-anchor="start">重估值  0.50</text><rect x="574" y="189" width="86" height="15" rx="7" fill="#0e706c"/><text x="688" y="204" font-size="18" font-weight="600" fill="#18384a" text-anchor="start">0.25</text><text x="380" y="248" font-size="19" font-weight="400" fill="#18384a" text-anchor="start">细分  0.20 / 0.80</text><rect x="574" y="233" width="55" height="15" rx="7" fill="#92521d"/><text x="688" y="248" font-size="18" font-weight="600" fill="#18384a" text-anchor="start">0.16</text><text x="380" y="279" font-size="17" font-weight="400" fill="#455e69" text-anchor="start">重估读数减少 0.04，细分再减少 0.09。</text><text x="773" y="123" font-size="18" font-weight="400" fill="#455e69" text-anchor="start">两个解释</text><text x="929" y="123" font-size="17" font-weight="400" fill="#455e69" text-anchor="middle">已执行 u</text><text x="1045" y="123" font-size="17" font-weight="400" fill="#455e69" text-anchor="middle">未试行为</text><text x="776" y="169" font-size="20" font-weight="600" fill="#18384a" text-anchor="start">解释一</text><text x="930" y="169" font-size="20" font-weight="500" fill="#0e706c" text-anchor="middle">相同</text><text x="1045" y="169" font-size="22" font-weight="600" fill="#92521d" text-anchor="middle">0.2</text><text x="776" y="220" font-size="20" font-weight="600" fill="#18384a" text-anchor="start">解释二</text><text x="930" y="220" font-size="20" font-weight="500" fill="#0e706c" text-anchor="middle">相同</text><text x="1045" y="220" font-size="22" font-weight="600" fill="#92521d" text-anchor="middle">0.8</text><path d="M987 136 V238" fill="none" stroke="#92521d" stroke-width="1" stroke-dasharray="5 5"/><text x="771" y="277" font-size="17" font-weight="400" fill="#455e69" text-anchor="start">按原行为采样，无法区分这两个解释。</text><rect x="14" y="307" width="1090" height="143" rx="7" fill="#eef4f4"/><text x="30" y="337" font-size="21" font-weight="650" fill="#18384a" text-anchor="start">一次控制选择</text><text x="178" y="337" font-size="19" font-weight="400" fill="#18384a" text-anchor="start">另一动作稳得 0.50</text><path d="M45 389 H87 L124 365" fill="none" stroke="#0e706c" stroke-width="2" marker-end="url(#t)"/><path d="M87 389 L124 414" fill="none" stroke="#92521d" stroke-width="2" marker-end="url(#a)"/><text x="139" y="370" font-size="18" font-weight="400" fill="#0e706c" text-anchor="start">X=0　选另一动作，取 0.50</text><text x="139" y="420" font-size="18" font-weight="400" fill="#92521d" text-anchor="start">X=1　执行 u，期望 0.80</text><text x="405" y="390" font-size="20" font-weight="600" fill="#18384a" text-anchor="start">均值 0.65</text><path d="M514 319 V436" fill="none" stroke="#b9c9cd" stroke-width="1"/><text x="539" y="337" font-size="21" font-weight="650" fill="#18384a" text-anchor="start">完整学习器的全程回报</text><path d="M550 381 H1079" fill="none" stroke="#455e69" stroke-width="2" marker-end="url(#b)"/><circle cx="582" cy="381" r="6" fill="#92521d" stroke="#92521d" stroke-width="2"/><text x="582" y="413" font-size="18" font-weight="500" fill="#92521d" text-anchor="middle">选试探</text><circle cx="712" cy="381" r="6" fill="#0e706c" stroke="#0e706c" stroke-width="2"/><text x="712" y="413" font-size="18" font-weight="500" fill="#0e706c" text-anchor="middle">得反馈</text><circle cx="856" cy="381" r="6" fill="#0e706c" stroke="#0e706c" stroke-width="2"/><text x="856" y="413" font-size="18" font-weight="500" fill="#0e706c" text-anchor="middle">再行动</text><circle cx="1019" cy="381" r="6" fill="#455e69" stroke="#455e69" stroke-width="2"/><text x="1019" y="413" font-size="18" font-weight="500" fill="#455e69" text-anchor="middle">同一时限</text><text x="539" y="441" font-size="17" font-weight="400" fill="#455e69" text-anchor="start">试探和正常行动共用原始时间，累计实际主奖励。</text></g></svg>