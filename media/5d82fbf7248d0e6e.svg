<svg xmlns="http://www.w3.org/2000/svg" width="618" height="358" viewBox="0 0 618 358"
     role="img" aria-labelledby="figure-title figure-desc" xml:lang="zh-CN">
  <title id="figure-title">技能改版后，两类尾值给出的行动排序</title>
  <desc id="figure-desc">两种技能从同一起点出发，走一步后交回控制，途中主奖励为零，备份为终点尾值的期望。旧版终点特征 X 以各二分之一的概率取负一和正一。新版总停在 X 等于零的位置。两版对仿射线性函数 a 加 bX 的期望都是 a；对平方尾值 X² 的期望分别为一和零。替代行动的价值为二分之一时，按平方尾值，旧版优先选技能，新版优先选替代行动。</desc>
  <rect width="618" height="358" fill="#fff"/>
  <g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" fill="#19344a">
    <text x="18" y="30" font-size="23" font-weight="650">技能改版后，两类尾值给出怎样的估值？</text>
    <text x="18" y="58" font-size="16">同一起点，一步交回，途中主奖励为 0。调用价值为 E[v(X)]。</text>
    <rect x="11" y="74" width="596" height="186" rx="8" fill="#f5f8f8"/>
    <g text-anchor="middle" font-size="17" font-weight="600">
      <text x="159" y="99">终点特征 X 的概率质量</text>
      <text x="351" y="99">线性尾值</text>
      <text x="515" y="99">二次尾值</text>
    </g>
    <g fill="#476071" text-anchor="middle" font-size="16">
      <text x="108" y="125">−1</text>
      <text x="159" y="125">0</text>
      <text x="210" y="125">+1</text>
      <text x="351" y="125">v(x) = a + bx</text>
      <text x="515" y="125">v(x) = x²</text>
    </g>
    <g stroke="#d2dedf" stroke-width="1">
      <path d="M21 135H597 M21 196H597 M262 84V249 M434 84V249" fill="none"/>
    </g>
    <g font-size="17" font-weight="650">
      <text x="26" y="173">旧版</text>
      <text x="26" y="236">新版</text>
    </g>
    <g stroke="#99acb0" stroke-width="1.3" fill="none">
      <path d="M87 182H231 M108 179V185 M159 179V185 M210 179V185"/>
      <path d="M87 247H231 M108 244V250 M159 244V250 M210 244V250"/>
    </g>
    <g fill="#086755" stroke="#086755" stroke-width="3">
      <path d="M108 182V164 M210 182V164 M159 247V211" fill="none"/>
      <circle cx="108" cy="164" r="3.3"/><circle cx="210" cy="164" r="3.3"/>
      <circle cx="159" cy="211" r="3.3"/>
    </g>
    <g fill="#086755" font-size="15" font-weight="650" text-anchor="middle">
      <text x="108" y="156">1/2</text><text x="210" y="156">1/2</text>
      <text x="179" y="217">1</text>
    </g>
    <g text-anchor="middle" font-size="25" font-weight="650">
      <text x="351" y="174">a</text><text x="351" y="239">a</text>
      <text x="515" y="174">1</text><text x="515" y="239">0</text>
    </g>
    <text x="18" y="290" font-size="18" font-weight="650">取 v(x) = x²，替代行动的价值为 1/2</text>
    <path d="M18 304H600" stroke="#b9c9cb"/>
    <g font-size="17">
      <text x="18" y="334">旧版　1 &gt; 1/2，选技能</text>
      <text x="309" y="334">新版　0 &lt; 1/2，选替代行动</text>
    </g>
  </g>
</svg>
