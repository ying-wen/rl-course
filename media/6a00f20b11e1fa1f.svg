<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 314" role="img" aria-labelledby="t d"><title id="t">一条命令经过身体才产生观测</title><desc id="d">策略选择命令，控制器将命令转换为物理控制，世界经传感器返回观测。</desc><g font-family="system-ui,PingFang SC,Microsoft YaHei,sans-serif"><rect x="0" y="0" width="900" height="314" rx="14" fill="#f9fbf9" stroke="none"/><text x="28" y="39" font-size="25" fill="#173847" font-weight="680" text-anchor="start">一条命令经过身体才产生观测</text><text x="36" y="84" font-size="19" fill="#007b71" font-weight="680" text-anchor="start">策略选择</text><text x="334" y="84" font-size="19" fill="#ae5425" font-weight="680" text-anchor="start">控制器执行</text><text x="663" y="84" font-size="19" fill="#173847" font-weight="680" text-anchor="start">世界与传感器</text><rect x="36" y="105" width="196" height="75" rx="10" fill="#eaf5f1" stroke="none"/><text x="52" y="134" font-size="18" fill="#173847" font-weight="410" text-anchor="start">发出一个命令 aᵢ</text><text x="52" y="159" font-size="15" fill="#516b72" font-weight="410" text-anchor="start">例如抬升目标位姿</text><path d="M239 144 L316 144" fill="none" stroke="#516b72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M307.4747547794049 149.22687228930658 L316 144 L307.4747547794049 138.77312771069342" fill="none" stroke="#516b72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><rect x="331" y="105" width="207" height="75" rx="10" fill="#faf0e5" stroke="none"/><text x="346" y="135" font-size="17" fill="#173847" font-weight="410" text-anchor="start">整形、限幅、反馈</text><path d="M348 164 h30 l9 -7 12 4 12 -12 9 1 8 -3 h24" fill="none" stroke="#ae5425" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M548 144 L623 144" fill="none" stroke="#516b72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M614.474754779405 149.22687228930658 L623 144 L614.474754779405 138.77312771069342" fill="none" stroke="#516b72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><g transform="translate(685,131)"><path d="M0 10 Q25 3 50 10 L44 47 Q24 54 7 47Z" fill="#d8eee7" stroke="#007b71" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M50 15 Q72 9 63 29 Q58 36 48 33" fill="none" stroke="#007b71" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M3 11 Q25 16 47 11" fill="none" stroke="#007b71" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M-13 56 H76" fill="none" stroke="#516b72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M-10 -20 V18 l6 5 M59 -20 V18 l-6 5" fill="none" stroke="#173847" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/></g><text x="648" y="214" font-size="16" fill="#173847" font-weight="410" text-anchor="start">位移、接触、滑移</text><path d="M780 223 V249 H130 V189" fill="none" stroke="#007b71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><path d="M130 202 L130 185" fill="none" stroke="#007b71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><path d="M135.22687228930658 193.52524522059505 L130 185 L124.7731277106934 193.52524522059505" fill="none" stroke="#007b71" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray=""/><text x="264" y="242" font-size="16" fill="#007b71" font-weight="410" text-anchor="start">读数带采样时刻和到达时刻；未到达的读数不能参与决策</text><text x="36" y="290" font-size="16" fill="#173847" font-weight="680" text-anchor="start">学习边界</text><text x="145" y="290" font-size="16" fill="#516b72" font-weight="410" text-anchor="start">固定低层控制器时，策略评价的动作是所发命令；力矩属于执行过程。</text></g></svg>