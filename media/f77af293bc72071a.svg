xt><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" text-anchor="middle" x="673.0878566662742" y="314" fill="#546971">200</text><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" text-anchor="middle" x="727.342456186525" y="314" fill="#546971">400</text><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="400" text-anchor="middle" x="781.5970557067758" y="314" fill="#546971">600</text><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="445" y="336" fill="#546971">左侧为对照占优，右侧为自主发现占优。</text><line stroke-width="3" stroke-dasharray="none" x1="26" y1="356" x2="48" y2="356" stroke="#14796f" /><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="55" y="361" fill="#183640">自主发现</text><line stroke-width="3" stroke-dasharray="none" x1="230" y1="356" x2="252" y2="356" stroke="#455f88" /><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="259" y="361" fill="#183640">固定通道</text><line stroke-width="3" stroke-dasharray="none" x1="26" y1="381" x2="48" y2="381" stroke="#ac541c" /><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="55" y="386" fill="#183640">预知通道</text><line stroke-width="3" stroke-dasharray="none" x1="230" y1="381" x2="252" y2="381" stroke="#875383" /><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="259" y="386" fill="#183640">预知、免筛选</text><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="445" y="365" fill="#546971">蓝灰段筛选，浅黄段练习与估计技能模型。</text><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="445" y="389" fill="#546971">第 1,500 步后到达的新订单需连续完成两道工序。</text><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="400" text-anchor="start" x="22" y="425" fill="#183640">回报含完成订单所得、控制动作成本和失败损失；恢复期间无法生产。</text></svg>