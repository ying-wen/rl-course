<svg aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img"><title id="title">技能发现与固定技能的全程净收益</title><desc id="desc">合成工位，72 个配对种子。左侧为累积净收益，右侧为自主发现减去各方案的配对均值与95%区间。</desc><rect x="0" y="0" width="860" height="440" rx="0" fill="#fafbf8" stroke="none" /><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="650" text-anchor="start" x="22" y="36" fill="#183640">技能发现的全程净收益</text><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="400" text-anchor="start" x="22" y="65" fill="#546971">合成无重置工位　72 个配对部署　每次失败需两个恢复时步</text><rect x="57.0" y="105" width="58.66666666666666" height="207" rx="0" fill="#edf0f2" stroke="none" /><rect x="115.66666666666666" y="105" width="58.66666666666666" height="207" rx="0" fill="#f4eddf" stroke="none" /><line stroke-width="1" stroke-dasharray="none" x1="57" y1="296.19277785583813" x2="409" y2="296.19277785583813" stroke="#546971" /><line stroke-width="1" stroke-dasharray="3 4" x1="57.0" y1="105" x2="57.0" y2="312" stroke="#546971" /><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="57.0" y="333" fill="#546971">0</text><line stroke-width="1" stroke-dasharray="3 4" x1="203.66666666666666" y1="105" x2="203.66666666666666" y2="312" stroke="#546971" /><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="203.66666666666666" y="333" fill="#546971">1500</text><line stroke-width="1" stroke-dasharray="3 4" x1="409.0" y1="105" x2="409.0" y2="312" stroke="#546971" /><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" text-anchor="middle" x="409.0" y="333" fill="#546971">3600</text><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" text-anchor="start" x="57" y="92" fill="#183640">从第一个时步累计的净收益</text><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" text-anchor="end" x="52" y="301.19277785583813" fill="#546971">0</text><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" text-anchor="end" x="52" y="206.34944499086697" fill="#546971">420</text><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="400" text-anchor="end" x="52" y="109.24793753387266" fill="#546971">850</text><path stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" d="M57.00 296.19 L86.33 294.79 L115.67 293.52 L145.00 288.51 L174.33 282.72 L203.67 265.90 L291.67 214.78 L409.00 147.27" fill="none" stroke="#14796f" /><path stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" d="M57.00 296.19 L86.33 294.79 L115.67 293.52 L145.00 291.35 L174.33 288.74 L203.67 283.19 L291.67 266.61 L409.00 245.13" fill="none" stroke="#455f88" /><path stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" d="M57.00 296.19 L86.33 294.79 L115.67 293.52 L145.00 288.49 L174.33 282.59 L203.67 265.58 L291.67 213.81 L409.00 145.40" fill="none" stroke="#ac541c" /><path stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" d="M57.00 296.19 L86.33 291.27 L115.67 285.46 L145.00 268.36 L174.33 251.34 L203.67 234.19 L291.67 182.37 L409.00 114.10" fill="none" stroke="#875383" /><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" text-anchor="start" x="445" y="92" fill="#183640">3,600 步内的配对净收益差（95% 区间）</text><line stroke-width="1.4" stroke-dasharray="4 4" x1="618.8332571460234" y1="109" x2="618.8332571460234" y2="299" stroke="#546971" /><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="445" y="124" fill="#183640">固定通道</text><line stroke-width="3" stroke-dasharray="none" x1="722.9627536402528" y1="119" x2="749.8388546045994" y2="119" stroke="#14796f" /><circle cx="736.400804122426" cy="119" r="4" fill="#14796f" /><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" text-anchor="end" x="842" y="124" fill="#183640">+433</text><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="445" y="153" fill="#183640">预知通道</text><line stroke-width="3" stroke-dasharray="none" x1="612.1178940904043" y1="148" x2="621.0628499133081" y2="148" stroke="#14796f" /><circle cx="616.5903720018562" cy="148" r="4" fill="#14796f" /><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" text-anchor="end" x="842" y="153" fill="#183640">-8</text><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="445" y="182" fill="#183640">预知、免筛选</text><line stroke-width="3" stroke-dasharray="none" x1="571.8154073827812" y1="177" x2="586.1738871458156" y2="177" stroke="#14796f" /><circle cx="578.9946472642984" cy="177" r="4" fill="#14796f" /><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" text-anchor="end" x="842" y="182" fill="#183640">-147</text><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" text-anchor="start" x="445" y="211" fill="#183640">预知且已会操作</text><line stroke-width="3" stroke-dasharray="none" x1="556.0690949640189" y1="206" x2="567.1392034501308" y2="206" stroke="#14796f" /><circle cx="561.6041492070748" cy="206" r="4" fill="#14796f" /><text font-family="PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" text-anchor="end" x="842" y="211" fill="#183640">-211<